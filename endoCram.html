// ===== ENDOCRINE QUIZ BANK =====  m = multi-select (answer is array)
const ENDO_QUIZ=[
{q:'Which SEVEN hormones does the hypothalamus produce for the anterior pituitary? (select all)',m:true,c:['TRH','CRH','GnRH','GHRH','GHIH (somatostatin)','PRH','PIH (dopamine)','TSH','ACTH','Prolactin','FSH','GH'],a:['TRH','CRH','GnRH','GHRH','GHIH (somatostatin)','PRH','PIH (dopamine)'],why:'Three singles (TRH, CRH, GnRH) plus two on/off pairs (GHRH/GHIH for growth hormone, PRH/PIH for prolactin) = 7. ADH and oxytocin are ALSO made in the hypothalamus but stored in the posterior pituitary — count them separately.'},
{q:'ADH and oxytocin are…',c:['Made and released by the posterior pituitary','Made in the hypothalamus, stored/released by the posterior pituitary','Made in the anterior pituitary','Made in the pineal gland'],a:'Made in the hypothalamus, stored/released by the posterior pituitary',why:'The posterior pituitary makes nothing. It is nervous tissue — axon terminals from the supraoptic (ADH) and paraventricular (oxytocin) nuclei.'},
{q:'Which of these is HYDROPHOBIC (lipid-soluble)?',c:['Insulin','Cortisol','Epinephrine','ADH'],a:'Cortisol',why:'Steroids (from cholesterol) and thyroid hormone are hydrophobic: they cross membranes, bind intracellular receptors, ride on carrier proteins, and are NOT stored. Peptides and catecholamines are hydrophilic.'},
{q:'Which of these is HYDROPHILIC (water-soluble)?',c:['Aldosterone','Testosterone','Thyroxine','Glucagon'],a:'Glucagon',why:'Glucagon is a peptide: water-soluble, membrane receptor, second messenger (cAMP), stored in granules. The other three are lipid-soluble.'},
{q:'Thyroxine is made from an amino acid, yet it behaves like a…',c:['Peptide hormone','Steroid hormone','Catecholamine','Prostaglandin'],a:'Steroid hormone',why:'Iodinated tyrosine is lipid-soluble: nuclear receptor, carrier protein (TBG), long half-life. The exception to the amine rule.'},
{q:'Hydrophilic hormones bind receptors located…',c:['In the nucleus','In the cytoplasm','On the cell membrane','In the mitochondria'],a:'On the cell membrane',why:'They cannot cross the lipid bilayer, so they signal through membrane receptors and second messengers like cAMP or IP₃.'},
{q:'Which hormone class is NOT stored and is synthesized on demand?',c:['Peptide','Steroid','Catecholamine','All are stored'],a:'Steroid',why:'Steroids diffuse out of the cell as soon as they are made. Peptides and catecholamines are pre-packaged in vesicles/granules.'},
{q:'Which hormone is stored EXTRACELLULARLY in colloid?',c:['Insulin','Cortisol','Thyroxine','PTH'],a:'Thyroxine',why:'T3/T4 are stored bound to thyroglobulin inside thyroid follicles — a weeks-to-months supply. No other hormone is stored this way.'},
{q:'Which zone of the adrenal cortex makes aldosterone?',c:['Zona glomerulosa','Zona fasciculata','Zona reticularis','Medulla'],a:'Zona glomerulosa',why:'GFR from outside in: Glomerulosa (salt), Fasciculata (sugar), Reticularis (sex).'},
{q:'Cortisol is a…',c:['Mineralocorticoid','Glucocorticoid','Catecholamine','Androgen'],a:'Glucocorticoid',why:'GLUCO = glucose. Cortisol raises blood glucose, breaks down protein and fat, suppresses immunity.'},
{q:'Aldosterone primarily controls…',c:['Blood glucose','Sodium and potassium','Calcium','Thyroid output'],a:'Sodium and potassium',why:'MINERALocorticoid = minerals. Keeps Na⁺ (water follows → BP up), dumps K⁺ and H⁺.'},
{q:'Main stimulus for aldosterone release?',c:['ACTH','Angiotensin II','TSH','Low blood glucose'],a:'Angiotensin II',why:'RAAS: low BP → renin → angiotensin II → aldosterone. ACTH has only a weak effect, unlike cortisol.'},
{q:'Graves disease is caused by…',c:['Iodine deficiency','Antibodies that destroy the thyroid','Antibodies that stimulate the TSH receptor','A pituitary tumor making TSH'],a:'Antibodies that stimulate the TSH receptor',why:'TSI mimics TSH → thyroid runs nonstop. TSH itself is LOW because T4 feeds back on the pituitary. Exophthalmos is Graves-specific.'},
{q:'Lab pattern in Graves disease?',c:['TSH ↑, T4 ↓','TSH ↓, T4 ↑','TSH ↑, T4 ↑','TSH ↓, T4 ↓'],a:'TSH ↓, T4 ↑',why:'High T4 shuts TSH off. The antibody is doing TSH\'s job.'},
{q:'Lab pattern in Hashimoto (primary hypothyroidism)?',c:['TSH ↑, T4 ↓','TSH ↓, T4 ↑','TSH ↓, T4 ↓','TSH normal, T4 ↑'],a:'TSH ↑, T4 ↓',why:'The thyroid is failing; the pituitary yells louder (TSH ↑) but gets no answer.'},
{q:'Heat intolerance, weight loss, tremor, tachycardia point to…',c:['Hypothyroidism','Hyperthyroidism','Addison disease','Diabetes insipidus'],a:'Hyperthyroidism',why:'Everything speeds up. Thyroid hormone raises metabolic rate and potentiates catecholamines.'},
{q:'Type 1 diabetes is…',c:['Insulin resistance','Autoimmune destruction of beta cells','Excess glucagon','ADH deficiency'],a:'Autoimmune destruction of beta cells',why:'Absolute insulin deficiency. C-peptide is low. Prone to ketoacidosis.'},
{q:'Type 2 diabetes is primarily…',c:['Absent insulin','Insulin resistance in target tissues','An autoimmune disease','Caused by cortisol excess'],a:'Insulin resistance in target tissues',why:'Insulin is present (often high early) but muscle, fat, and liver ignore it. Linked to obesity.'},
{q:'Massive dilute urine, intense thirst, NO glucose in urine =',c:['Diabetes mellitus','Diabetes insipidus','SIADH','Conn syndrome'],a:'Diabetes insipidus',why:'ADH is missing or the kidney ignores it → can\'t concentrate urine. Insipid = tasteless.'},
{q:'Which hormone is the ONLY one that lowers blood glucose?',c:['Glucagon','Cortisol','Insulin','Epinephrine'],a:'Insulin',why:'The other three RAISE glucose (with GH they are the counter-regulatory hormones).'},
{q:'Which hormone RAISES blood calcium?',c:['Calcitonin','PTH','Insulin','Aldosterone'],a:'PTH',why:'PTH pulls Ca from bone, keeps it at the kidney, and activates vitamin D. Calcitonin tones calcium down.'},
{q:'Oxytocin during labor is an example of…',c:['Negative feedback','Positive feedback','Tonic inhibition','Circadian control'],a:'Positive feedback',why:'Stretch → oxytocin → contraction → more stretch → more oxytocin, until the baby is out.'},
{q:'Which anterior pituitary hormone is under chronic INHIBITION by the hypothalamus?',c:['TSH','ACTH','Prolactin','GH'],a:'Prolactin',why:'Dopamine (PIH) tonically holds prolactin down. Cut the pituitary stalk and prolactin rises while everything else falls.'},
{q:'Moon face, buffalo hump, purple striae, hyperglycemia =',c:['Addison disease','Cushing syndrome','Conn syndrome','Acromegaly'],a:'Cushing syndrome',why:'Cortisol excess. Most common cause: steroid medication. Cushing DISEASE = pituitary ACTH adenoma.'},
{q:'Bronzed skin, low BP, hyponatremia, hyperkalemia =',c:['Cushing syndrome','Addison disease','Pheochromocytoma','Hashimoto'],a:'Addison disease',why:'Whole cortex fails: no cortisol, no aldosterone. ACTH rises and drags MSH along → pigmentation.'},
{q:'Excess GH in an adult causes…',c:['Gigantism','Acromegaly','Dwarfism','Cretinism'],a:'Acromegaly',why:'Growth plates are closed, so bones thicken instead of lengthen: hands, feet, jaw.'},
{q:'Which is a catecholamine?',c:['Melatonin','Norepinephrine','Thyroxine','Cortisol'],a:'Norepinephrine',why:'Catecholamines (dopamine, NE, epi) are tyrosine-derived amines with a catechol ring; water-soluble, fast, membrane receptors.'},
{q:'Epinephrine differs from norepinephrine mainly by…',c:['Being a steroid','Strong β2 effects: bronchodilation and glucose release','Being made in the cortex','Lowering heart rate'],a:'Strong β2 effects: bronchodilation and glucose release',why:'NE is mostly α (vasoconstriction, pressure). Epi hits β2 hard: opens airways, dumps glucose — why an EpiPen treats anaphylaxis.'},
{q:'Melatonin is secreted by the ___ in response to ___.',c:['Pineal gland; darkness','Pineal gland; light','Hypothalamus; darkness','Thyroid; cold'],a:'Pineal gland; darkness',why:'Retina → SCN → sympathetic → pineal. Light shuts it off.'},
{q:'Thymopoietin acts on…',c:['B lymphocytes','T lymphocytes','Red blood cells','Platelets'],a:'T lymphocytes',why:'THYmus → T cells. Bone marrow → B cells.'},
{q:'Which hormones share a common α subunit? (select all)',m:true,c:['TSH','FSH','LH','hCG','ACTH','GH','Prolactin'],a:['TSH','FSH','LH','hCG'],why:'The four glycoprotein hormones share the α chain; the β chain gives specificity. That is why hCG can act like LH.'},
{q:'Which of these are made by the anterior pituitary? (select all)',m:true,c:['GH','TSH','ACTH','FSH','LH','Prolactin','ADH','Oxytocin','TRH'],a:['GH','TSH','ACTH','FSH','LH','Prolactin'],why:'Six anterior pituitary hormones. ADH/oxytocin are posterior (made in hypothalamus). TRH is hypothalamic.'},
{q:'Which hormones are steroids? (select all)',m:true,c:['Cortisol','Aldosterone','Estrogen','Progesterone','Testosterone','Insulin','Epinephrine','Thyroxine'],a:['Cortisol','Aldosterone','Estrogen','Progesterone','Testosterone'],why:'All five come from cholesterol in the adrenal cortex or gonads. Thyroxine is lipid-soluble but an amine, not a steroid.'},
{q:'Why can steroid hormones be taken as pills but insulin cannot?',c:['Insulin is too large to absorb','Peptides are digested in the gut; steroids are lipid-soluble and absorbed','Steroids are stored in the liver','Insulin is a steroid'],a:'Peptides are digested in the gut; steroids are lipid-soluble and absorbed',why:'Same reason thyroxine (levothyroxine) and prednisone are pills while insulin is injected.'},
{q:'LH acts on which cells in the male?',c:['Sertoli cells','Leydig cells','Chief cells','Chromaffin cells'],a:'Leydig cells',why:'LH → Leydig → testosterone. FSH → Sertoli → sperm support + inhibin.'},
{q:'Progesterone during the luteal phase…',c:['Proliferates the endometrium','Makes the endometrium secretory and maintains it','Triggers ovulation','Lowers body temperature'],a:'Makes the endometrium secretory and maintains it',why:'Estrogen builds (proliferative), progesterone maintains (secretory). PRO-gestation.'},
{q:'PTH deficiency after thyroid surgery presents with…',c:['Kidney stones','Tetany and tingling (low calcium)','Hyperglycemia','Hypertension'],a:'Tetany and tingling (low calcium)',why:'Low Ca makes nerves hyperexcitable: Chvostek (cheek tap) and Trousseau (cuff) signs.'},
{q:'The adrenal MEDULLA is best described as…',c:['Steroid-producing glandular tissue','A modified sympathetic ganglion releasing catecholamines','Part of the kidney','The source of aldosterone'],a:'A modified sympathetic ganglion releasing catecholamines',why:'Chromaffin cells are postganglionic sympathetic neurons without axons; preganglionic ACh triggers epi/NE release.'},
];

// ===== BLOOD TYPING MODULE =====
const BT_TYPES=['O-','O+','A-','A+','B-','B+','AB-','AB+'];
const BT=t=>{const abo=t.replace(/[+-]/,''),rh=t.endsWith('+');return{abo,rh,ag:[...(abo==='O'?[]:abo.split('')),...(rh?['D']:[])],ab:[...(abo==='A'?['B']:abo==='B'?['A']:abo==='O'?['A','B']:[])]}};
const btSafe=(donor,recip)=>{const d=BT(donor),r=BT(recip);if(d.ag.some(a=>r.ab.includes(a)))return false;if(d.rh&&!r.rh)return false;return true};
const BT_FREQ={'O+':'37%','A+':'36%','B+':'9%','AB+':'3%','O-':'7%','A-':'6%','B-':'2%','AB-':'1%'};
// cards: {id, cls (for color), front, sub, back:[[label,text],...], mn}
const BLOOD_CARDS=[
{id:'bt:abo',cls:'peptide',front:'What is the ABO system based on?',back:[['Answer','Antigens (agglutinogens) on the red cell surface: A, B, both, or neither.'],['Antibodies','Antibodies (agglutinins) in the plasma against whichever antigen you DON\'T have.'],['Why','You never make antibodies against your own antigens — that would destroy your own blood.']],mn:'Antigen on the cell, antibody in the plasma, and they are always opposites.'},
{id:'bt:a',cls:'peptide',front:'Type A',back:[['Antigen','A antigen on RBCs'],['Antibody','Anti-B in plasma'],['Can receive RBCs','A, O'],['Can donate RBCs to','A, AB'],['Genotype','IᴬIᴬ or Iᴬi']],mn:'A has A, hates B.'},
{id:'bt:b',cls:'amine',front:'Type B',back:[['Antigen','B antigen on RBCs'],['Antibody','Anti-A in plasma'],['Can receive RBCs','B, O'],['Can donate RBCs to','B, AB'],['Genotype','IᴮIᴮ or Iᴮi']],mn:'B has B, hates A.'},
{id:'bt:ab',cls:'steroid',front:'Type AB',back:[['Antigen','BOTH A and B antigens'],['Antibody','NONE in plasma'],['Can receive RBCs','Everyone — universal RECIPIENT'],['Can donate RBCs to','AB only'],['Genotype','IᴬIᴮ (codominant)']],mn:'AB has everything, so it fights nothing. Takes from all, gives to few.'},
{id:'bt:o',cls:'peptide',front:'Type O',back:[['Antigen','NO A or B antigen'],['Antibody','BOTH anti-A and anti-B'],['Can receive RBCs','O only'],['Can donate RBCs to','Everyone — universal DONOR'],['Genotype','ii (recessive)']],mn:'O = zerO antigens. Nothing on it for anyone to attack, but it attacks everything. Gives to all, takes from few.'},
{id:'bt:rh',cls:'amine',front:'What is the Rh factor?',back:[['Answer','The D antigen on RBCs. Rh+ has it (~85% of people), Rh− does not.'],['Antibody','Rh− people have NO anti-D at birth. They make it only after exposure to Rh+ blood (transfusion or pregnancy) — "sensitization."'],['Key difference','ABO antibodies are natural and present by ~6 months; anti-D must be provoked.']],mn:'Rh = "Rhesus" — named for the monkey it was found in. D is the antigen; no D = negative.'},
{id:'bt:igm',cls:'peptide',front:'Anti-A and anti-B are which antibody class?',back:[['Answer','IgM — large pentamers.'],['Consequence','Cannot cross the placenta, so ABO mismatch between mother and fetus rarely causes serious disease.'],['Also','IgM is a strong agglutinator — this is why ABO transfusion reactions are fast and severe.']],mn:'IgM = Massive, stays in Mom.'},
{id:'bt:igg',cls:'amine',front:'Anti-D (Rh antibody) is which antibody class?',back:[['Answer','IgG — small.'],['Consequence','CROSSES the placenta → can attack an Rh+ fetus → hemolytic disease of the newborn (erythroblastosis fetalis).'],['When','Usually the SECOND Rh+ pregnancy — the first one sensitizes the mother.']],mn:'IgG = Goes across to the baby.'},
{id:'bt:hdn',cls:'amine',front:'Hemolytic disease of the newborn',back:[['Setup','Rh− mother, Rh+ father, Rh+ fetus.'],['Mechanism','Fetal RBCs leak into mom at delivery → mom makes anti-D (IgG) → next Rh+ pregnancy, anti-D crosses placenta → destroys fetal RBCs.'],['Signs','Fetal anemia, jaundice, hydrops fetalis, kernicterus (bilirubin brain damage).'],['Prevention','RhoGAM.']],mn:'First baby sensitizes, second baby suffers — unless RhoGAM.'},
{id:'bt:rhogam',cls:'amine',front:'RhoGAM',back:[['What','Anti-D immunoglobulin (pre-made IgG).'],['Who','Rh− mothers carrying (or who may be carrying) an Rh+ baby.'],['When','~28 weeks gestation AND within 72 hours after delivery, miscarriage, or any bleed.'],['How it works','Coats and clears any fetal Rh+ cells before mom\'s immune system notices them — so she never gets sensitized.']],mn:'RhoGAM = passive antibody that hides the evidence.'},
{id:'bt:aggl',cls:'steroid',front:'Agglutination',back:[['Definition','Clumping of RBCs when antibody binds its matching antigen and cross-links cells.'],['In the lab','How blood is typed: mix a drop with anti-A, anti-B, anti-D serum and see which wells clump.'],['In the body','Clumped cells block small vessels and are destroyed (hemolysis) → transfusion reaction.']],mn:'Agglutinate = clump. Antigen + matching antibody = clump.'},
{id:'bt:react',cls:'steroid',front:'Acute hemolytic transfusion reaction',back:[['Cause','Recipient antibodies attack donor RBC antigens (usually ABO clerical error).'],['Signs','Fever, chills, flank/back pain, hypotension, red-brown urine (hemoglobinuria), shock, DIC.'],['Danger','Free hemoglobin clogs kidney tubules → acute kidney failure.'],['Do','Stop the transfusion immediately, keep the IV open with saline.']],mn:'Fever + back pain + dark urine during a transfusion = stop it now.'},
{id:'bt:type',cls:'peptide',front:'How is blood typed?',back:[['Method','Three wells: anti-A serum, anti-B serum, anti-D serum. Add a drop of blood to each.'],['Read it','Clumps with anti-A only → A−. Clumps with anti-B and anti-D → B+. Clumps everywhere → AB+. No clumps → O−.'],['Rule','A clump means the cell HAS that antigen.']],mn:'The serum has the antibody; if it clumps, the antigen is there.'},
{id:'bt:udonor',cls:'peptide',front:'Universal donor (red cells)',back:[['Answer','O negative.'],['Why','No A, no B, no D antigen — nothing on the cell for anyone\'s antibodies to grab.'],['Caveat','Only for packed RBCs. O plasma is full of anti-A and anti-B, so whole O blood is NOT universal.']],mn:'O− red cells: blank slate, safe for everyone.'},
{id:'bt:urecip',cls:'steroid',front:'Universal recipient (red cells)',back:[['Answer','AB positive.'],['Why','Has every antigen, so has NO antibodies — cannot attack any donor cells.']],mn:'AB+ owns everything, so it fights nothing.'},
{id:'bt:plasma',cls:'steroid',front:'Plasma compatibility is REVERSED',back:[['Universal plasma donor','AB — its plasma has no antibodies.'],['Universal plasma recipient','O — its cells have no antigens for donor antibodies to attack.'],['Why reversed','With plasma you are giving the ANTIBODIES, not the cells.']],mn:'RBCs: O gives, AB takes. Plasma: AB gives, O takes.'},
{id:'bt:gen',cls:'amine',front:'ABO genetics',back:[['Alleles','Iᴬ, Iᴮ (codominant to each other), i (recessive).'],['Genotypes','A = IᴬIᴬ or Iᴬi · B = IᴮIᴮ or Iᴮi · AB = IᴬIᴮ · O = ii'],['Example','Parents Iᴬi × Iᴮi can have children of ALL four types.'],['Rh','D is dominant: DD or Dd = Rh+, dd = Rh−.']],mn:'A and B are codominant — both show. i is silent.'},
{id:'bt:freq',cls:'peptide',front:'Blood type frequencies (US)',back:[['Common','O+ ~37%, A+ ~36%'],['Less','B+ ~9%, O− ~7%, A− ~6%'],['Rare','AB+ ~3%, B− ~2%, AB− ~1%'],['Rh','About 85% Rh+, 15% Rh−']],mn:'O and A are the big two. AB− is rarest.'},
{id:'bt:cross',cls:'peptide',front:'Cross-matching',back:[['Major crossmatch','Donor RBCs + recipient plasma → look for agglutination. This is the one that matters.'],['Minor crossmatch','Donor plasma + recipient RBCs.'],['Why','ABO/Rh typing misses rarer antigens (Kell, Duffy, Kidd); crossmatch catches them.']],mn:'Major = donor cells in recipient serum. Recipient antibodies are the threat.'},
{id:'bt:why',cls:'amine',front:'Why does a first Rh mismatch transfusion cause little harm but a second is dangerous?',back:[['Answer','Rh− people start with no anti-D. The first exposure sensitizes (primary response, slow, mostly IgM). The second exposure gets a fast IgG memory response → hemolysis.'],['Contrast','ABO antibodies are already there, so even the FIRST ABO-mismatched transfusion reacts immediately.']],mn:'ABO: pre-loaded gun. Rh: has to be loaded first.'},
];
const BLOOD_QUIZ=[
{q:'A person with type B blood has which antibodies in their plasma?',c:['Anti-A','Anti-B','Anti-A and anti-B','None'],a:'Anti-A',why:'B has the B antigen, so it makes antibodies against what it lacks: anti-A.'},
{q:'Which blood type is the universal RBC donor?',c:['AB+','AB−','O+','O−'],a:'O−',why:'No A, B, or D antigens — nothing for a recipient\'s antibodies to attack.'},
{q:'Which blood type is the universal RBC recipient?',c:['AB+','O−','A+','B+'],a:'AB+',why:'Has every antigen, so has no antibodies at all.'},
{q:'Blood clumps with anti-B serum and anti-D serum but NOT anti-A. Type?',c:['A+','B+','B−','AB+'],a:'B+',why:'A clump means the antigen is present: B antigen yes, D antigen yes, A antigen no.'},
{q:'Blood shows NO clumping in any well (anti-A, anti-B, anti-D). Type?',c:['O+','O−','AB−','AB+'],a:'O−',why:'No antigens at all → nothing to react with.'},
{q:'Can an A− patient safely receive O+ red cells?',c:['Yes','No — the B antigen','No — the D antigen','No — anti-A'],a:'No — the D antigen',why:'O+ cells carry D. An Rh− recipient may be sensitized or already have anti-D. Rh− recipients get Rh− blood.'},
{q:'Can an AB+ patient receive B− red cells?',c:['Yes','No — anti-B','No — the D antigen','No — anti-A'],a:'Yes',why:'AB+ has no antibodies; B− cells carry only the B antigen and no D. Safe.'},
{q:'Hemolytic disease of the newborn most classically involves…',c:['Rh+ mother, Rh− fetus','Rh− mother, Rh+ fetus','Type O mother, type A fetus','Type AB mother, type O fetus'],a:'Rh− mother, Rh+ fetus',why:'Mom is sensitized by the first Rh+ baby, then her anti-D (IgG) crosses the placenta in later pregnancies.'},
{q:'Why do ABO antibodies rarely cause hemolytic disease of the newborn?',c:['They are IgM and don\'t cross the placenta','Fetuses have no ABO antigens','Mothers don\'t make ABO antibodies','The placenta destroys them'],a:'They are IgM and don\'t cross the placenta',why:'IgM is a huge pentamer. Anti-D is IgG, which does cross.'},
{q:'RhoGAM is given to…',c:['Rh+ mothers before delivery','Rh− mothers around 28 weeks and within 72 h of delivering an Rh+ baby','Rh+ newborns','Anyone receiving O− blood'],a:'Rh− mothers around 28 weeks and within 72 h of delivering an Rh+ baby',why:'Passive anti-D clears fetal Rh+ cells before the mother\'s immune system can respond.'},
{q:'The genotype of a type O person is…',c:['IᴬIᴬ','Iᴬi','IᴬIᴮ','ii'],a:'ii',why:'i is recessive; O requires two copies. Iᴬ and Iᴮ are codominant.'},
{q:'Two parents, Iᴬi and Iᴮi, could have children of which types?',c:['A and B only','AB only','A, B, AB, and O','O only'],a:'A, B, AB, and O',why:'IᴬIᴮ (AB), Iᴬi (A), Iᴮi (B), ii (O) — one of each possible.'},
{q:'Universal PLASMA donor?',c:['O−','AB','A','B'],a:'AB',why:'Reversed from red cells: AB plasma contains no anti-A or anti-B, so it can be given to anyone.'},
{q:'Fever, chills, back pain, and dark urine 15 minutes into a transfusion. Most likely?',c:['Allergic reaction','Acute hemolytic transfusion reaction','Fluid overload','Normal'],a:'Acute hemolytic transfusion reaction',why:'Recipient antibodies are destroying donor cells. Stop the transfusion; hemoglobin in urine threatens the kidneys.'},
{q:'Rh− individuals have anti-D antibodies…',c:['From birth','Only after exposure to Rh+ blood','Never','Only if they are also type O'],a:'Only after exposure to Rh+ blood',why:'Unlike anti-A/anti-B, anti-D is not naturally occurring; it needs a sensitizing event.'},
{q:'Most common blood type in the US?',c:['A+','O+','B+','AB+'],a:'O+',why:'O+ ~37%, A+ ~36% — together nearly three-quarters of the population.'},
{q:'Which antigens does AB− blood carry? (select all)',m:true,c:['A','B','D','None'],a:['A','B'],why:'A and B antigens present; no D (Rh negative).'},
{q:'Which blood types can donate RBCs to a B+ recipient? (select all)',m:true,c:['O−','O+','B−','B+','A−','AB+'],a:['O−','O+','B−','B+'],why:'B+ has anti-A only, and is Rh+ so D is fine. Anything without the A antigen works.'},
];
</script>
<header>
  <div class="row" style="gap:8px"><h1>Cram<span>·</span></h1><select class="sel modsel" id="modsel"></select></div>
  <div class="hstats">
    <span class="hbest">best <b id="hBest">—</b></span>
    <button class="ring" id="ringBtn" style="--p:0" aria-label="Progress"><b id="ringTxt">0%</b></button>
  </div>
</header>
<main id="view"></main>
<nav><div class="tabs" id="tabs"></div></nav>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
// ===== helpers =====
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const byId=Object.fromEntries(H.map(h=>[h.id,h]));
const CLS={peptide:'Peptide / protein',steroid:'Steroid',amine:'Amine'};
const glandLabel=h=>h.gland==='adrenal'?(h.id==='epi'?'Adrenal medulla':'Adrenal cortex'):GLANDS[h.gland].name;
const glandLabels=[...new Set(H.map(glandLabel))];
const EFFECT={ins:'Lowers blood glucose',gluc:'Raises blood glucose',gh:'Raises blood glucose',cort:'Raises blood glucose',epi:'Raises blood glucose',ne:'Raises blood pressure / volume',prh:'Stimulates prolactin',pth:'Raises blood calcium',calt:'Raises blood calcium',calc:'Lowers blood calcium',aldo:'Raises blood pressure / volume',renin:'Raises blood pressure / volume',adh:'Raises blood pressure / volume',anp:'Lowers blood pressure / volume',t4:'Raises metabolic rate',lep:'Suppresses appetite',ghr:'Stimulates appetite',oxt:'Milk ejection / uterine contraction',prl:'Milk production',epo:'Raises red blood cell count',mel:'Signals sleep / darkness',gast:'Stimulates stomach acid',sec:'Stimulates pancreatic bicarbonate',cck:'Gallbladder contraction / pancreatic enzymes',inc:'Boosts insulin after oral glucose',hcg:'Maintains corpus luteum',inh:'Inhibits FSH',da:'Inhibits prolactin',sst:'Inhibits GH, insulin, glucagon'};
const STORAGE_Q={ins:'Stored in secretory granules',gh:'Stored in secretory granules',pth:'Stored in secretory granules',gluc:'Stored in secretory granules',acth:'Stored in secretory granules',tsh:'Stored in secretory granules',adh:'Made in hypothalamus, stored in posterior pituitary',oxt:'Made in hypothalamus, stored in posterior pituitary',cort:'Not stored — made on demand from cholesterol',aldo:'Not stored — made on demand from cholesterol',test:'Not stored — made on demand from cholesterol',est:'Not stored — made on demand from cholesterol',prog:'Not stored — made on demand from cholesterol',calt:'Not stored — made on demand from cholesterol',epi:'Stored in chromaffin granules',ne:'Stored in chromaffin granules',t4:'Stored extracellularly in colloid as thyroglobulin'};

// ===== persistent state =====
const KEY='endocram-v1';
let S={box:{},wrong:{},best:{},match:{},clinic:{},quiz:{},mod:'endo'};
const store={get(){try{const v=localStorage.getItem(KEY);if(v)S={...S,...JSON.parse(v)}}catch(e){}},set(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}};
store.get();
const box=h=>S.box[h.id]||0;
function mastery(list){list=list||MOD().allCards();if(!list.length)return 0;const t=list.reduce((a,h)=>a+box(h),0);return Math.round(100*t/(5*list.length))}
function refreshHeader(){const m=mastery();$('#ringBtn').style.setProperty('--p',m);$('#ringTxt').textContent=m+'%';const b=Math.max(0,...Object.entries(S.best).filter(([k])=>k.startsWith(mod+':')).map(([,v])=>v));$('#hBest').textContent=b||'—'}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1400)}

// ===== shared renderers =====
const chip=h=>`<span class="chip cls c-${h.cls}"><i class="dot"></i>${CLS[h.cls]}</span>`;
const SOLCHIP=h=>`<span class="chip" style="color:${SOL(h)==='hydrophobic'?'var(--steroid)':'var(--peptide)'}">${SOL(h)}</span>`;
function hormoneBack(h){
  return `<h2>${esc(h.name)}</h2>
  <div class="row" style="margin-bottom:10px">${chip(h)}${SOLCHIP(h)}<span class="chip">${esc(glandLabel(h))}</span></div>
  <dl class="kv">
    <dt>Full</dt><dd>${esc(h.full)}</dd>
    <dt>Type</dt><dd>${esc(h.sub)}</dd>
    <dt>Solubility</dt><dd><b style="color:${SOL(h)==='hydrophobic'?'var(--steroid)':'var(--peptide)'}">${SOL(h)==='hydrophobic'?'HYDROPHOBIC — lipid-soluble, crosses membranes, intracellular receptor':'HYDROPHILIC — water-soluble, membrane receptor, second messenger'}</b></dd>
    <dt>Source</dt><dd>${esc(h.cells)}</dd>
    <dt>Target</dt><dd>${esc(h.target)}</dd>
    <dt>Action</dt><dd>${esc(h.action)}</dd>
    <dt>Storage</dt><dd>${esc(h.storage)}</dd>
    <dt>Control</dt><dd>${esc(h.control)}</dd>
    ${h.hi?`<dt>Excess</dt><dd>${esc(h.hi)}</dd>`:''}
    ${h.lo?`<dt>Deficit</dt><dd>${esc(h.lo)}</dd>`:''}
    <dt>Hook</dt><dd class="mn">${esc(h.mn)}</dd>
  </dl>`;
}
function sheet(html){$('#modalRoot').innerHTML=`<div class="modal" id="modal"><div class="sheet"><div class="grab"></div>${html}</div></div>`;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()})}
function closeSheet(){$('#modalRoot').innerHTML=''}
function openHormone(id){const h=byId[id];sheet(`<div class="c-${h.cls}">${hormoneBack(h)}</div><button class="btn" style="width:100%;margin-top:14px" onclick="closeSheet()">Close</button>`)}
function openProgress(){
  const m=MOD();const groups={};m.allCards().forEach(c=>{(groups[c.group]??=[]).push(c)});
  const rows=Object.entries(groups).map(([g,l])=>{const ms=mastery(l);return `<div class="r"><span>${esc(g)}</span><div class="bar"><i style="width:${ms}%"></i></div><b>${ms}%</b></div>`}).join('');
  const weak=m.allCards().filter(c=>(S.wrong[c.id]||0)>0).sort((x,y)=>S.wrong[y.id]-S.wrong[x.id]).slice(0,8);
  sheet(`<h2>${esc(m.name)} progress</h2><p class="eyebrow">Mastery — 5 correct in a row = 100%</p><div class="mast">${rows}</div>
  ${weak.length?`<h3>Most missed</h3><div class="row">${weak.map(c=>`<button class="chip cls c-${c.cls}" onclick="openCard('${c.id}')"><i class="dot"></i>${esc(c.title)} ×${S.wrong[c.id]}</button>`).join('')}</div>`:''}
  <div class="row" style="margin-top:16px"><button class="btn" style="flex:1" onclick="closeSheet()">Close</button><button class="btn small bad" onclick="if(confirm('Wipe all progress in every module?')){S={box:{},wrong:{},best:{},match:{},clinic:{},quiz:{}};store.set();refreshHeader();closeSheet();render()}">Reset</button></div>`);
}
function openCard(id){const c=MOD().allCards().find(x=>x.id===id);if(!c)return;if(byId[id])return openHormone(id);sheet(`<div class="c-${c.cls}">${c.back}</div><button class="btn" style="width:100%;margin-top:14px" onclick="closeSheet()">Close</button>`)}
$('#ringBtn').onclick=openProgress;

// ===== MODULES =====
const ICON={cards:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="16" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>',
 blitz:'<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
 match:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/><path d="M13 7h4a4 4 0 0 1 4 4v0M11 17H7a4 4 0 0 1-4-4v0"/></svg>',
 quiz:'<svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>',
 clinic:'<svg viewBox="0 0 24 24"><path d="M6 3v6a6 6 0 0 0 12 0V3"/><path d="M12 15v3a3 3 0 0 0 6 0v-1"/><circle cx="18" cy="16" r="1.5"/></svg>',
 map:'<svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M8 10h8l1 12H7z"/><circle cx="12" cy="15" r="1.5"/></svg>',
 lab:'<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4 20a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1L14 9V3"/><path d="M7 15h10"/></svg>'};
const TABNAME={cards:'Cards',blitz:'Blitz',match:'Match',quiz:'Quiz',clinic:'Clinic',map:'Map',lab:'Lab'};
// A module supplies: name, tabs, allCards() → [{id,cls,group,title,front,sub,back}], cardFilters → [[value,label,fn]],
// drills → {key:{label,pool,q,hint,answer,choices,show,cols,cls,small}}, quiz → [{q,c,a,m,why}], plus any custom tab renderers.
const MODULES={
 endo:{name:'Endocrine',tabs:['cards','blitz','match','quiz','clinic','map'],
   allCards:()=>H.map(h=>({id:h.id,cls:h.cls,group:glandLabel(h),title:h.name,h})),
   cardFilters:()=>[['core','My class list (27)',h=>CORE.includes(h.h.id)],['hypo7','Hypothalamic seven',h=>HYPO7.includes(h.h.id)],['all','All hormones (43)',()=>true],['weak','Weak spots',h=>box(h)<3||S.wrong[h.id]],['cls:peptide','Peptides',h=>h.cls==='peptide'],['cls:steroid','Steroids',h=>h.cls==='steroid'],['cls:amine','Amines',h=>h.cls==='amine'],['sol:hydrophilic','Hydrophilic',h=>SOL(h.h)==='hydrophilic'],['sol:hydrophobic','Hydrophobic',h=>SOL(h.h)==='hydrophobic'],...glandLabels.map(g=>[g,g,h=>h.group===g])],
   quiz:()=>[...ENDO_QUIZ,...genEndoQuiz()]},
 blood:{name:'Blood typing',tabs:['cards','blitz','quiz','lab'],
   allCards:()=>BLOOD_CARDS.map(c=>({id:c.id,cls:c.cls,group:'Blood typing',title:c.front.length>28?c.front.slice(0,26)+'…':c.front,front:c.front,sub:'',back:`<h2>${esc(c.front)}</h2><dl class="kv">${c.back.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}<dt>Hook</dt><dd class="mn">${esc(c.mn)}</dd></dl>`})),
   cardFilters:()=>[['all','All cards',()=>true],['weak','Weak spots',c=>box(c)<3||S.wrong[c.id]]],
   quiz:()=>[...BLOOD_QUIZ,...genBloodQuiz()]},
};
let mod=S.mod||'endo';const MOD=()=>MODULES[mod];
let tab='cards';
$('#modsel').innerHTML=Object.entries(MODULES).map(([k,m])=>`<option value="${k}"${k===mod?' selected':''}>${m.name}</option>`).join('');
$('#modsel').onchange=e=>{mod=e.target.value;S.mod=mod;store.set();tab=MOD().tabs[0];cardState.cur=null;M.tiles=[];Q.on=false;stopBlitz();render()};
function buildTabs(){const t=MOD().tabs;$('#tabs').style.gridTemplateColumns=`repeat(${t.length},1fr)`;$('#tabs').innerHTML=t.map(k=>`<button data-t="${k}">${ICON[k]}<span>${TABNAME[k]}</span></button>`).join('')}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;stopBlitz();render()};
function render(){buildTabs();document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));refreshHeader();({cards,blitz,match,quiz,clinic,map,lab})[tab]();window.scrollTo(0,0)}

// ===== CARDS =====
const cardState={filter:null,mode:'name',cur:null,flipped:false};
function cardPool(){const fs=MOD().cardFilters();if(!fs.some(f=>f[0]===cardState.filter))cardState.filter=fs[0][0];const f=fs.find(f=>f[0]===cardState.filter);return MOD().allCards().filter(f[2])}
function nextCard(){const pool=cardPool();if(!pool.length){cardState.cur=null;return}
  const w=pool.map(c=>(cardState.cur&&c.id===cardState.cur.id?0.2:1)*(6-box(c)));const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
  for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){cardState.cur=pool[i];break}}cardState.flipped=false}
function cards(){
  const pool=cardPool();if(!cardState.cur||!pool.some(c=>c.id===cardState.cur.id))nextCard();
  const c=cardState.cur;const v=$('#view');const isH=c&&!!c.h;
  const front=c?(isH?(cardState.mode==='name'
      ?`<div class="name">${esc(c.h.name)}</div>${c.h.full!==c.h.name?`<div class="sub">${esc(c.h.full)}</div>`:''}`
      :`<div class="name cue">${esc(glandLabel(c.h))} · ${esc(c.h.cells.split(';')[0])}</div><div class="sub">${esc(c.h.action)}</div>`)
    :`<div class="name cue" style="font-size:clamp(22px,6vw,30px)">${esc(c.front)}</div>`):'';
  v.innerHTML=`<div class="deckbar">
    <select class="sel" id="cf">${MOD().cardFilters().map(([val,lab])=>`<option value="${val}"${val===cardState.filter?' selected':''}>${lab}</option>`).join('')}</select>
    ${isH?`<div class="seg"><button class="${cardState.mode==='name'?'on':''}" data-m="name">Name → facts</button><button class="${cardState.mode==='cue'?'on':''}" data-m="cue">Clue → name</button></div>`:''}
  </div>
  ${c?`<div class="scene"><div class="card c-${c.cls}${cardState.flipped?' flipped':''}" id="card" tabindex="0" role="button" aria-label="Flip card">
    <div class="face front">
      <div class="top"><span>${isH?(cardState.mode==='name'?'hormone':'who am I?'):'recall'}</span><span>box ${box(c)}/5</span></div>
      <div class="big">${front}</div>
      <div class="tap">tap to flip</div>
    </div>
    <div class="face back">${isH?hormoneBack(c.h):c.back}</div>
  </div></div>
  <div class="grade"><button class="btn bad" id="gAgain">Again</button><button class="btn ok" id="gGot">Got it</button></div>
  <div class="prog">${pool.length} in deck · deck mastery ${mastery(pool)}%</div>
  <div class="boxes">${[1,2,3,4,5].map(i=>`<i class="${box(c)>=i?'f':''}"></i>`).join('')}</div>`
  :`<div class="empty">Nothing here yet.</div>`}`;
  $('#cf').onchange=e=>{cardState.filter=e.target.value;cardState.cur=null;cards()};
  v.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{cardState.mode=b.dataset.m;cardState.flipped=false;cards()});
  if(!c)return;
  const card=$('#card');const flip=()=>{cardState.flipped=!cardState.flipped;card.classList.toggle('flipped',cardState.flipped)};
  card.onclick=flip;card.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
  const grade=ok=>{if(ok)S.box[c.id]=Math.min(5,box(c)+1);else{S.box[c.id]=0;S.wrong[c.id]=(S.wrong[c.id]||0)+1}store.set();nextCard();cards()};
  $('#gAgain').onclick=()=>grade(false);$('#gGot').onclick=()=>grade(true);
}

// ===== BLITZ =====

const MATCH_MODES={gland:['Hormone ↔ Gland',h=>glandLabel(h)],action:['Hormone ↔ Action',h=>EFFECT[h.id]||h.action.split('.')[0]],target:['Hormone ↔ Target',h=>h.target.split(';')[0].split('(')[0].trim()],cond:['Hormone ↔ Disorder',h=>h.hi||h.lo]};

  M.tiles=shuffle([...sel.map(h=>({id:h.id,type:'h',text:h.name,cls:h.cls})),...sel.map(h=>({id:h.id,type:'p',text:fn(h)}))]);M.pick=null;M.done=0;M.t0=Date.now();clearInterval(M.timer);M.timer=setInterval(()=>{const e=$('#mt');if(e)e.textContent=((Date.now()-M.t0)/1000).toFixed(1)+'s'},100)}
function match(){const v=$('#view');if(mod!=='endo'){tab='cards';return render()}if(!M.tiles.length)newMatch();
  v.innerHTML=`<div class="row" style="justify-content:space-between"><select class="sel" id="mm">${Object.entries(MATCH_MODES).map(([k,m])=>`<option value="${k}"${k===M.mode?' selected':''}>${m[0]}</option>`).join('')}</select><span class="chip"><b id="mt">0.0s</b></span></div>

  $('#mg').onclick=e=>{const b=e.target.closest('.tile');if(!b||M.busy)return;const i=+b.dataset.i,t=M.tiles[i];
    if(M.pick===null){M.pick=i;b.classList.add('pick');return}

function genEndoQuiz(){const out=[];
  pick(SCOPE(),6).forEach(h=>{out.push({q:`${h.name} is…`,c:['hydrophilic','hydrophobic'],a:SOL(h),why:`${h.name} is ${CLS[h.cls].toLowerCase()} → ${SOL(h)}. ${SOL(h)==='hydrophobic'?'Crosses the membrane, intracellular receptor, carrier protein, not stored.':'Membrane receptor, second messenger, stored in vesicles.'}`,gen:h.id})});
  pick(SCOPE(),6).forEach(h=>{out.push({q:`Where is ${h.name} produced?`,c:[glandLabel(h),...pick(glandLabels.filter(g=>g!==glandLabel(h)),3)],a:glandLabel(h),why:h.cells+'.',gen:h.id})});
  pick(SCOPE().filter(h=>h.hi||h.lo),4).forEach(h=>{const hi=h.hi&&Math.random()<.5||!h.lo;const ans=hi?h.hi:h.lo;const others=pick(H.filter(x=>x!==h).flatMap(x=>[x.hi,x.lo]).filter(Boolean),3);out.push({q:`${hi?'Excess':'Deficiency'} of ${h.name} causes…`,c:[ans,...others],a:ans,why:h.mn,gen:h.id})});
  return out}
function genBloodQuiz(){const out=[];pick(btPairs(),5).forEach(p=>{const s=btSafe(p.donor,p.recip);const d=BT(p.donor),r=BT(p.recip);const why=s?'Donor cells carry no antigen the recipient has antibodies against'+(d.rh?' and the recipient is Rh+.':'.') :(d.ag.some(x=>r.ab.includes(x))?`Recipient has anti-${d.ag.find(x=>r.ab.includes(x))}; donor cells carry that antigen → agglutination.`:'Rh+ cells into an Rh− recipient → risk of sensitization/anti-D reaction.');out.push({q:`Donor ${p.donor} red cells → recipient ${p.recip}. Safe?`,c:['Safe','Reaction'],a:s?'Safe':'Reaction',why,gen:'bt:'+p.recip})});return out}
const Q={on:false,qs:[],i:0,picked:new Set(),answered:false,score:0,miss:[]};
function quiz(){const v=$('#view');const key=mod+':quiz';
  if(!Q.on){const hist=S.quiz[key]||[];v.innerHTML=`<div class="panel"><p class="eyebrow">multiple choice</p><h2>Quiz</h2><p style="color:var(--muted);font-size:14px;margin:0 0 12px">10 questions per round, mixed from the question bank and freshly generated ones. Some are "select all that apply" — tap every answer, then Check.</p>
    <div class="row" style="justify-content:space-between"><span class="chip">${hist.length?'last: '+hist[hist.length-1]+'/10 · best: '+Math.max(...hist)+'/10':'no rounds yet'}</span><button class="btn primary" id="qstart">Start round</button></div></div>
    ${Q.miss.length?`<div class="panel"><h3 style="margin-top:0">Review last round</h3><ul class="missed" style="padding:0;list-style:none;margin:0">${Q.miss.map(m=>`<li><b>${esc(m.q)}</b><br><span>${esc(m.why)}</span></li>`).join('')}</ul></div>`:''}`;
    $('#qstart').onclick=()=>{Object.assign(Q,{on:true,qs:pick(MOD().quiz(),10).map(q=>({...q,c:shuffle(q.c)})),i:0,picked:new Set(),answered:false,score:0,miss:[]});quiz()};return}
  if(Q.i>=Q.qs.length){const h=S.quiz[key]=(S.quiz[key]||[]).concat(Q.score).slice(-20);store.set();Q.on=false;
    v.innerHTML=`<div class="panel result"><div class="eyebrow">round complete</div><div class="score">${Q.score}<span style="font-size:24px;color:var(--muted)">/10</span></div>
    ${Q.miss.length?`<ul class="missed" style="padding:0;list-style:none">${Q.miss.map(m=>`<li><b>${esc(m.q)}</b><br><span>Answer: ${esc(Array.isArray(m.a)?m.a.join(', '):m.a)}. </span>${esc(m.why)}</li>`).join('')}</ul>`:'<p style="color:var(--ok)">Perfect round.</p>'}
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="quiz()">Back</button></div>`;return}
  const q=Q.qs[Q.i];const multi=!!q.m;const isRight=o=>multi?q.a.includes(o):o===q.a;
  v.innerHTML=`<div class="bhead"><span>question ${Q.i+1} of ${Q.qs.length}${multi?' · select all that apply':''}</span><span><b style="font-size:18px">${Q.score}</b></span></div>
  <div class="case"><div class="sx" style="margin-top:0">${esc(q.q)}</div>
  <div class="choices" id="qc">${q.c.map(o=>`<button data-o="${esc(o)}" class="${Q.picked.has(o)?'pick':''}${Q.answered?(isRight(o)?' right':Q.picked.has(o)?' wrong':''):''}"${Q.answered?' disabled':''}>${esc(o)}</button>`).join('')}</div>
  ${!Q.answered&&multi?`<button class="btn primary" id="qcheck" style="width:100%;margin-top:12px"${Q.picked.size?'':' disabled'}>Check</button>`:''}
  ${Q.answered?`<div class="explain"><b>${Q.last?'Correct':'Not quite'}${multi?' — answer: '+esc(q.a.join(', ')):''}</b>${esc(q.why)}</div><button class="btn primary" id="qnext" style="width:100%;margin-top:12px">${Q.i+1<Q.qs.length?'Next':'Finish'}</button>`:''}</div>`;
  const finish=()=>{const ok=multi?(q.c.every(o=>isRight(o)===Q.picked.has(o))):isRight([...Q.picked][0]);Q.last=ok;Q.answered=true;if(ok)Q.score++;else{Q.miss.push(q);if(q.gen){S.wrong[q.gen]=(S.wrong[q.gen]||0)+1;store.set()}}quiz();$('#qnext')?.scrollIntoView({behavior:'smooth',block:'end'})};
  $('#qc').onclick=e=>{const b=e.target.closest('button');if(!b||Q.answered)return;const o=b.dataset.o;if(multi){Q.picked.has(o)?Q.picked.delete(o):Q.picked.add(o);b.classList.toggle('pick');const ck=$('#qcheck');if(ck)ck.disabled=!Q.picked.size}else{Q.picked=new Set([o]);finish()}};
  $('#qcheck')&&($('#qcheck').onclick=finish);
  $('#qnext')&&($('#qnext').onclick=()=>{Q.i++;Q.picked=new Set();Q.answered=false;quiz()});
}

// ===== LAB (blood typing) =====
const L={donor:'O-',recip:'A+',tray:'A+'};
function lab(){const v=$('#view');const s=btSafe(L.donor,L.recip);const d=BT(L.donor),r=BT(L.recip);
  const why=s?`${L.donor} cells carry ${d.ag.length?d.ag.join(' and ')+' antigen'+(d.ag.length>1?'s':''):'no antigens'}. ${L.recip} plasma has ${r.ab.length?'anti-'+r.ab.join(' and anti-'):'no antibodies'}${d.rh?'; recipient is Rh+ so D is fine':''}. No match → no clumping.`
    :(d.ag.some(x=>r.ab.includes(x))?`${L.recip} plasma has anti-${d.ag.find(x=>r.ab.includes(x))}. ${L.donor} cells carry the ${d.ag.find(x=>r.ab.includes(x))} antigen. Antibody meets antigen → agglutination and hemolysis.`:`${L.donor} cells carry the D antigen. ${L.recip} is Rh− — first exposure sensitizes, any later exposure (or pregnancy) reacts. Rh− recipients get Rh− cells.`);
  const sel=(id,val)=>`<select class="sel" id="${id}">${BT_TYPES.map(t=>`<option${t===val?' selected':''}>${t}</option>`).join('')}</select>`;
  v.innerHTML=`<div class="panel"><p class="eyebrow">transfusion check</p><div class="row" style="gap:10px;align-items:end"><div><div class="eyebrow">donor cells</div>${sel('ld',L.donor)}</div><span style="font-size:22px;padding-bottom:6px">→</span><div><div class="eyebrow">recipient</div>${sel('lr',L.recip)}</div></div>
    <div class="explain" style="border-color:${s?'var(--ok)':'var(--bad)'}"><b style="color:${s?'var(--ok)':'var(--bad)'}">${s?'Compatible':'Transfusion reaction'}</b>${esc(why)}</div></div>
  <div class="panel"><p class="eyebrow">compatibility grid — donor (rows) → recipient (columns)</p><div class="cgrid"><div></div>${BT_TYPES.map(t=>`<div class="ch">${t}</div>`).join('')}${BT_TYPES.map(dn=>`<div class="ch">${dn}</div>${BT_TYPES.map(rc=>`<button class="cell ${btSafe(dn,rc)?'ok':'no'}" data-d="${dn}" data-r="${rc}">${btSafe(dn,rc)?'✓':'✕'}</button>`).join('')}`).join('')}</div>
    <p style="font-size:13px;color:var(--muted);margin:10px 0 0">O− row is all ✓ (universal donor). AB+ column is all ✓ (universal recipient). Tap any cell to load it above.</p></div>
  <div class="panel"><p class="eyebrow">typing tray</p><div class="row" style="justify-content:space-between"><span style="font-size:14px">Blood type:</span>${sel('lt',L.tray)}</div>${trayHtml(L.tray)}
    <p style="font-size:13px;color:var(--muted);margin:6px 0 0">Each well holds antibody serum. A clump means the cell HAS that antigen: ${BT(L.tray).ag.length?BT(L.tray).ag.map(x=>x+' antigen').join(', ')+' present':'no antigens present'}.</p></div>
  <div class="panel"><p class="eyebrow">quick table</p><table><tr><th>Type</th><th>Antigens</th><th>Antibodies</th><th>Gets RBCs from</th><th>US</th></tr>${BT_TYPES.map(t=>{const b=BT(t);return `<tr><td style="text-transform:none;font-size:13px">${t}</td><td style="color:var(--chalk);font-family:var(--body);text-transform:none">${b.ag.join(', ')||'none'}</td><td style="color:var(--chalk);font-family:var(--body);text-transform:none">${b.ab.map(x=>'anti-'+x).join(', ')||'none'}</td><td style="color:var(--chalk);font-family:var(--body);text-transform:none;white-space:normal">${BT_TYPES.filter(dn=>btSafe(dn,t)).join(' ')}</td><td style="text-transform:none">${BT_FREQ[t]}</td></tr>`}).join('')}</table></div>`;
  $('#ld').onchange=e=>{L.donor=e.target.value;lab()};$('#lr').onchange=e=>{L.recip=e.target.value;lab()};$('#lt').onchange=e=>{L.tray=e.target.value;lab()};
  v.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{L.donor=b.dataset.d;L.recip=b.dataset.r;lab()});
}

render();
</script>
