// ===== BLOOD & CELLS MODULE =====
const BLOOD2_CARDS=[
{id:'bl:comp',cls:'peptide',g:'Overview',front:'The three visible layers of centrifuged blood',back:[['Plasma','~55% of volume. Straw-colored liquid on top.'],['Buffy coat','<1%. Thin whitish layer — leukocytes and platelets.'],['Erythrocytes','~45% at the bottom. This percentage is the HEMATOCRIT.'],['Normal hematocrit','Males ~47%, females ~42%.']],mn:'Plasma on top, buffy coat in the middle, red cells on the bottom. Hematocrit = the red fraction.'},
{id:'bl:plasma',cls:'peptide',g:'Overview',front:'What is plasma made of?',back:[['Water','92%'],['Everything else','8% — proteins, electrolytes, nutrients, gases, wastes, hormones'],['Plasma proteins','Albumin (most abundant; osmotic pressure), globulins (antibodies, transport), fibrinogen (clotting)'],['Plasma vs serum','Serum is plasma with the clotting factors removed.']],mn:'92% water, 8% everything else. Albumin is the big one.'},
{id:'bl:func',cls:'peptide',g:'Overview',front:'Functions of blood',back:[['Transport','O₂ and CO₂, nutrients, hormones, wastes, heat'],['Regulation','Body temperature, pH (buffers), fluid volume'],['Protection','Clotting to stop blood loss; leukocytes and antibodies against infection']],mn:'Transport, Regulate, Protect.'},
{id:'bl:rbc',cls:'amine',g:'Erythrocytes',front:'Erythrocyte structure',back:[['Shape','Biconcave disc — maximizes surface area for gas exchange and lets it fold through capillaries.'],['No nucleus','Ejected during development. No organelles, no mitochondria.'],['Consequence','Cannot divide or repair itself, and cannot use the oxygen it carries (relies on anaerobic glycolysis). Lifespan ~120 days.'],['Contents','Over 95% of its dry weight is hemoglobin.'],['Count','Males ~5.4 million/mm³, females ~4.8 million/mm³.']],mn:'No nucleus = more room for hemoglobin, but no repairs, so it wears out in 120 days.'},
{id:'bl:hb',cls:'amine',g:'Erythrocytes',front:'Hemoglobin structure',back:[['Globin','Four polypeptide chains — two alpha, two beta.'],['Heme','One heme group per chain, each with a central iron (Fe²⁺) atom.'],['Capacity','Each iron binds ONE O₂ → 4 O₂ per hemoglobin molecule.'],['Oxyhemoglobin','Hb bound to O₂ (bright red). Deoxyhemoglobin = O₂ released (darker red).'],['CO₂','Carried on the globin part (carbaminohemoglobin), not the iron — only ~20% of CO₂ travels this way.']],mn:'4 chains, 4 hemes, 4 irons, 4 oxygens. O₂ rides the iron; CO₂ rides the protein.'},
{id:'bl:epo',cls:'amine',g:'Erythrocytes',front:'Regulation of erythropoiesis',back:[['Trigger','Low blood O₂ (hypoxia) — from blood loss, high altitude, lung disease, or fewer RBCs.'],['Sensor','The KIDNEY detects it and releases erythropoietin (EPO).'],['Effect','EPO drives red bone marrow to make more erythrocytes → O₂ carrying capacity rises → hypoxia resolves → EPO falls.'],['Loop type','Negative feedback.'],['Raw materials','Iron, vitamin B₁₂, folate, and amino acids.']],mn:'Kidney is the oxygen sensor. Low O₂ → EPO → marrow → more RBCs. Kidney failure → anemia.'},
{id:'bl:death',cls:'amine',g:'Erythrocytes',front:'Erythrocyte death and recycling',back:[['Where','Old, fragile RBCs are trapped and eaten by macrophages in the spleen ("the red blood cell graveyard"), liver, and marrow.'],['Globin','Broken into amino acids and reused.'],['Iron','Salvaged, bound to transferrin, stored as ferritin, sent back to marrow.'],['Heme','Becomes bilirubin → liver → bile → intestine → stercobilin (brown stool). Some becomes urobilin (yellow urine).'],['Clinical','Bilirubin backing up = jaundice.']],mn:'Save the iron, dump the heme. Bilirubin colors bile, stool, urine — and jaundiced skin.'},
{id:'bl:anemia',cls:'amine',g:'Anemia',front:'What is anemia?',back:[['Definition','Low RBC count OR low hemoglobin → blood cannot carry enough oxygen.'],['Signs','Fatigue, pallor, shortness of breath, cold intolerance, rapid heart rate, headache.'],['Three types in this course','Iron deficiency, pernicious, sickle cell.']],mn:'Anemia is not a disease, it is a finding. Always ask which of the three.'},
{id:'bl:iron',cls:'amine',g:'Anemia',front:'Iron deficiency anemia',back:[['Cause','Not enough iron — chronic blood loss (menstruation, GI bleed), poor diet, or poor absorption.'],['Result','Not enough heme → cells are small and pale (microcytic, hypochromic).'],['Treatment','Iron supplements; find and stop the bleeding.']],mn:'No iron, no heme, no oxygen. Small pale cells.'},
{id:'bl:pern',cls:'amine',g:'Anemia',front:'Pernicious anemia',back:[['Cause','Vitamin B₁₂ deficiency — usually a lack of INTRINSIC FACTOR from stomach parietal cells, not a lack of B₁₂ in the diet.'],['Why','B₁₂ needs intrinsic factor to be absorbed in the ileum. Often autoimmune destruction of parietal cells.'],['Result','RBCs cannot divide properly → large, immature cells (macrocytic / megaloblastic).'],['Treatment','B₁₂ injections — swallowing it will not work without intrinsic factor.']],mn:'Iron deficiency = small cells. Pernicious = big cells. Intrinsic factor is the missing key.'},
{id:'bl:sickle',cls:'amine',g:'Anemia',front:'Sickle cell anemia',back:[['Cause','Genetic — abnormal hemoglobin S (HbS) from a single amino acid substitution in the beta chain.'],['Trait vs disease','ONE defective copy = sickle-cell trait, generally asymptomatic. TWO copies = sickle-cell disease.'],['Mechanism','When oxygen levels drop, HbS crystallizes and the cell deforms into a crescent/sickle shape.'],['Consequence','Sickled cells are rigid — they rupture (hemolysis) and jam small vessels, causing pain crises, organ damage, and stroke.'],['Trigger','Low O₂: exertion, altitude, infection, dehydration.']],mn:'Low oxygen is what makes it sickle. One copy = carrier, two copies = disease.'},
{id:'bl:poly',cls:'amine',g:'Anemia',front:'Polycythemia',back:[['Definition','Too MANY erythrocytes — the opposite of anemia.'],['Primary','Polycythemia vera — bone marrow cancer, hematocrit can exceed 60–70%.'],['Secondary','A normal response to low oxygen: living at high altitude, chronic lung disease.'],['Blood doping','Artificially induced with EPO or transfusion.'],['Danger','Blood becomes viscous and sludgy → clots, stroke, strain on the heart.']],mn:'Thick blood does not flow. High hematocrit is a clotting risk, not an advantage.'},
{id:'bl:wbc',cls:'steroid',g:'Leukocytes',front:'Leukocyte counts and terms',back:[['Normal','5,000 – 10,000 per mm³'],['Leukocytosis','ABOVE 10,000 — usually infection.'],['Leukopenia','BELOW 5,000 — marrow suppression, some drugs, some viruses.'],['Leukemia','Cancer — huge numbers of nonfunctional immature leukocytes.']],mn:'-osis = too many, -penia = too few. 5k to 10k is the window.'},
{id:'bl:diap',cls:'steroid',g:'Leukocytes',front:'Diapedesis and chemotaxis',back:[['Diapedesis','Leukocytes squeeze BETWEEN the endothelial cells of a capillary wall to leave the bloodstream and enter tissue.'],['Chemotaxis','They then travel along a chemical trail released by damaged tissue and pathogens toward the injury.'],['Why it matters','Leukocytes are the only formed elements that do their real work OUTSIDE the vessel. Blood is just transport.']],mn:'Diapedesis = get out of the vessel. Chemotaxis = follow the smell to the fight.'},
{id:'bl:gran',cls:'steroid',g:'Leukocytes',front:'The two categories of leukocytes',back:[['Granulocytes','Visible granules, lobed nuclei: NEUTROPHILS, EOSINOPHILS, BASOPHILS.'],['Agranulocytes','No visible granules, rounder nuclei: LYMPHOCYTES, MONOCYTES.'],['Order by abundance','Neutrophils > Lymphocytes > Monocytes > Eosinophils > Basophils.']],mn:'"Never Let Monkeys Eat Bananas" — most to least abundant. First three are granulocytes.'},
{id:'bl:neut',cls:'steroid',g:'Leukocytes',front:'Neutrophils',back:[['Abundance','~50–70% — the most common leukocyte.'],['Nucleus','Multi-lobed (3–6 lobes) — "polymorphonuclear," PMN.'],['Job','Phagocytosis of BACTERIA. First responders to infection.'],['Note','They die at the scene — pus is largely dead neutrophils.']],mn:'Neutrophils are the infantry: most numerous, first in, bacteria-killers, and they die there.'},
{id:'bl:eos',cls:'steroid',g:'Leukocytes',front:'Eosinophils',back:[['Abundance','~2–4%'],['Nucleus','Bilobed — often described as a pair of sunglasses. Stains red/orange with eosin.'],['Job','Attack PARASITIC WORMS (too big to phagocytize — they release enzymes onto them) and moderate allergic reactions.']],mn:'Eosinophils fight parasites and show up in allergies. Red-staining sunglasses.'},
{id:'bl:baso',cls:'steroid',g:'Leukocytes',front:'Basophils',back:[['Abundance','<1% — the RAREST leukocyte.'],['Nucleus','Bilobed but usually hidden by dark purple granules.'],['Granules contain','HISTAMINE (vasodilator, attracts other WBCs) and HEPARIN (anticoagulant).'],['Job','Drive the inflammatory and allergic response.']],mn:'Basophils = the rarest, and the ones that make you swell and itch. Histamine + heparin.'},
{id:'bl:lymph',cls:'steroid',g:'Leukocytes',front:'Lymphocytes',back:[['Abundance','~25% — second most common.'],['Appearance','Large round nucleus filling almost the whole cell, thin rim of cytoplasm.'],['T cells','Attack infected cells directly (cell-mediated immunity). Matured in the thymus.'],['B cells','Become plasma cells that produce ANTIBODIES (humoral immunity).'],['NK cells','Kill cancerous and virus-infected cells.']],mn:'Big nucleus, no room for anything else. T = thymus/attack, B = antibodies.'},
{id:'bl:mono',cls:'steroid',g:'Leukocytes',front:'Monocytes',back:[['Abundance','~3–8% — the LARGEST leukocyte.'],['Nucleus','Kidney- or U-shaped.'],['Job','Leaves the blood and becomes a MACROPHAGE in tissue — a long-lived, powerful phagocyte.'],['Also','Presents antigens to lymphocytes, activating the specific immune response. Handles chronic infections and cleans up debris.']],mn:'Monocyte in the blood, macrophage in the tissue. Biggest cell, kidney-shaped nucleus.'},
{id:'bl:leuko',cls:'steroid',g:'Leukocytes',front:'Leukopoiesis',back:[['Origin','All formed elements come from the hemocytoblast (pluripotent hematopoietic stem cell) in red bone marrow.'],['Two lines','Myeloid stem cell → granulocytes, monocytes, erythrocytes, platelets. Lymphoid stem cell → lymphocytes.'],['Regulation','Colony-stimulating factors (CSFs) and interleukins direct which line is produced.']],mn:'One stem cell, two branches. Lymphoid makes only lymphocytes; myeloid makes everything else.'},
{id:'bl:plat',cls:'peptide',g:'Platelets',front:'Platelets',back:[['What they are','Cell FRAGMENTS, not whole cells. No nucleus.'],['Count','150,000 – 300,000 per mm³.'],['Thrombocytopenia','Below 150,000 → easy bruising, petechiae, bleeding.'],['Lifespan','~10 days.'],['Job','Form the platelet plug and release the chemicals that drive clotting.']],mn:'Fragments, not cells. 150k–300k. Below 150k = thrombocytopenia.'},
{id:'bl:thrombo',cls:'peptide',g:'Platelets',front:'Thrombopoiesis',back:[['Path','Hemocytoblast → megakaryoblast → MEGAKARYOCYTE, a giant multi-lobed cell in the marrow.'],['How','The megakaryocyte presses against a marrow sinusoid and its cytoplasm fragments off into the blood as platelets.'],['Hormone','THROMBOPOIETIN, from the liver.']],mn:'One giant megakaryocyte shatters into thousands of platelets. Liver hormone: thrombopoietin.'},
{id:'bl:hemo',cls:'peptide',g:'Hemostasis',front:'The five parts of hemostasis',back:[['1','Vascular spasm'],['2','Platelet plug formation'],['3','Coagulation (intrinsic and extrinsic pathways)'],['4','Clot retraction'],['5','Thrombolysis'],['Purpose','Form a gelatinous clot that plugs the broken vessel and limits blood loss.']],mn:'Spasm, Plug, Coagulate, Retract, Dissolve. Squeeze it, patch it, cement it, tighten it, clean it up.'},
{id:'bl:spasm',cls:'peptide',g:'Hemostasis',front:'Part 1: Vascular spasm',back:[['When','Immediately on injury, as blood leaks into extracellular fluid.'],['Two responses','Vasoconstriction of the vessel, and increased tissue pressure from the leaked blood pressing inward.'],['Effect','Both shrink the vessel diameter, so local blood pressure and blood flow drop and blood loss is minimized.'],['Limit','Buys time only — a spasm alone will not stop bleeding.']],mn:'The vessel clamps down on itself first. Fastest and crudest step.'},
{id:'bl:plug',cls:'peptide',g:'Hemostasis',front:'Part 2: Platelet plug formation',back:[['Trigger','Injury exposes COLLAGEN under the endothelium.'],['vWF','Injured endothelial cells release von Willebrand factor, a glycoprotein that binds receptors on the platelet membrane.'],['Adhesion','Collagen plus vWF make platelets STICKY — they adhere to the vessel wall and to one another.'],['Activation','That binding triggers platelet activation: granules release ATP, ADP, serotonin, calcium, and clotting factors.'],['Positive feedback','Released ADP and thromboxane A₂ recruit and activate MORE platelets → the plug grows.']],mn:'Collagen + vWF = sticky. This step is positive feedback — platelets calling in more platelets.'},
{id:'bl:coag',cls:'peptide',g:'Hemostasis',front:'Part 3: Coagulation — the two pathways',back:[['Extrinsic','Fast (seconds). Triggered by TISSUE FACTOR (factor III) from damaged tissue OUTSIDE the vessel. Fewer steps.'],['Intrinsic','Slower (minutes). Triggered by factors already INSIDE the blood contacting exposed collagen. More steps.'],['Common pathway','Both converge on factor X → prothrombin activator.'],['Final cascade','Prothrombin activator → PROTHROMBIN becomes THROMBIN → thrombin converts FIBRINOGEN into FIBRIN.'],['Result','Fibrin threads mesh across the plug and trap cells, forming the clot. Calcium and vitamin K are required.']],mn:'Extrinsic = outside/fast. Intrinsic = inside/slow. Both end the same way: prothrombin → thrombin → fibrinogen → fibrin.'},
{id:'bl:retract',cls:'peptide',g:'Hemostasis',front:'Part 4: Clot retraction',back:[['What','Actin and myosin in the trapped platelets contract, pulling the fibrin threads tighter.'],['Effect','The clot shrinks, squeezing out serum and pulling the torn edges of the vessel together.'],['Timing','Within 30–60 minutes.'],['Then','Platelet-derived growth factor (PDGF) and VEGF stimulate the vessel wall to actually repair itself.']],mn:'The clot tightens like a stitch being pulled, drawing the wound edges together.'},
{id:'bl:lysis',cls:'peptide',g:'Hemostasis',front:'Part 5: Thrombolysis',back:[['What','Removal of the clot once the vessel is healed.'],['How','Plasminogen was built into the clot; tissue plasminogen activator (tPA) converts it to PLASMIN.'],['Plasmin','Digests fibrin and dissolves the clot.'],['Clinically','tPA is given as a drug to break up clots in stroke and heart attack.']],mn:'Plasminogen sits in the clot waiting. tPA switches it on to plasmin, which eats fibrin.'},
{id:'bl:clot',cls:'peptide',g:'Hemostasis',front:'Thrombus vs embolus',back:[['Thrombus','A clot that forms and STAYS attached where it formed. Dangerous if it blocks the vessel.'],['Embolus','A clot (or air/fat) that has BROKEN LOOSE and is traveling in the bloodstream.'],['Embolism','What happens when the embolus lodges somewhere — pulmonary embolism, stroke.'],['Prevention normally','Smooth intact endothelium, heparin from basophils/mast cells, and rapid dilution of clotting factors by flowing blood.']],mn:'Thrombus stays home. Embolus travels. A traveling clot is the dangerous one.'},
];
const BLOOD2_QUIZ=[
{q:'Hematocrit refers to the percentage of blood volume made up of…',c:['Plasma','Erythrocytes','Leukocytes','Platelets'],a:'Erythrocytes',why:'Roughly 45%. Plasma is ~55% and the buffy coat is under 1%.'},
{q:'Plasma is what percent water?',c:['75%','85%','92%','99%'],a:'92%',why:'92% water, 8% solutes — proteins, electrolytes, nutrients, wastes, gases, hormones.'},
{q:'Why can a mature erythrocyte not repair itself?',c:['It has no nucleus or organelles','It has too much hemoglobin','It is too small','It never gets damaged'],a:'It has no nucleus or organelles',why:'Ejecting the nucleus makes room for hemoglobin but leaves no way to make new proteins. Lifespan ~120 days.'},
{q:'How many oxygen molecules can one hemoglobin carry?',c:['1','2','4','8'],a:'4',why:'Four polypeptide chains, each with a heme and one iron atom, each iron binding one O₂.'},
{q:'Which organ senses low blood oxygen and releases EPO?',c:['Liver','Kidney','Spleen','Bone marrow'],a:'Kidney',why:'The kidney is the oxygen sensor; EPO then drives the red marrow. This is why kidney failure causes anemia.'},
{q:'Old erythrocytes are mainly destroyed in the…',c:['Kidney','Spleen','Lungs','Pancreas'],a:'Spleen',why:'Macrophages in the spleen (also liver and marrow) engulf them. Iron is recycled; heme becomes bilirubin.'},
{q:'Pernicious anemia results from a deficiency of…',c:['Iron','Vitamin B₁₂ / intrinsic factor','Folate only','Erythropoietin'],a:'Vitamin B₁₂ / intrinsic factor',why:'Usually the stomach fails to make intrinsic factor, so B₁₂ cannot be absorbed. Treated by injection.'},
{q:'What triggers red blood cells to sickle in sickle-cell disease?',c:['High oxygen','Low oxygen','High iron','Cold temperature'],a:'Low oxygen',why:'HbS crystallizes when O₂ drops — exertion, altitude, infection, dehydration.'},
{q:'A person with ONE copy of the sickle-cell gene has…',c:['Sickle-cell disease','Sickle-cell trait, generally asymptomatic','No gene effect at all','Pernicious anemia'],a:'Sickle-cell trait, generally asymptomatic',why:'Two defective copies are required for the disease.'},
{q:'Normal leukocyte count is…',c:['150,000–300,000 per mm³','5,000–10,000 per mm³','4–6 million per mm³','500–1,000 per mm³'],a:'5,000–10,000 per mm³',why:'Above 10,000 = leukocytosis, below 5,000 = leukopenia.'},
{q:'Squeezing between endothelial cells to leave a capillary is called…',c:['Chemotaxis','Diapedesis','Phagocytosis','Hemostasis'],a:'Diapedesis',why:'Diapedesis gets them out of the vessel; chemotaxis then guides them to the injury.'},
{q:'Which is the MOST abundant leukocyte?',c:['Lymphocyte','Monocyte','Neutrophil','Basophil'],a:'Neutrophil',why:'~50–70%. First responders that phagocytize bacteria. "Never Let Monkeys Eat Bananas."'},
{q:'Which is the RAREST leukocyte?',c:['Eosinophil','Basophil','Monocyte','Lymphocyte'],a:'Basophil',why:'Under 1%. Releases histamine and heparin, driving inflammation and allergy.'},
{q:'Which leukocyte becomes a macrophage in tissue?',c:['Neutrophil','Monocyte','Eosinophil','Basophil'],a:'Monocyte',why:'The largest leukocyte, with a kidney-shaped nucleus. Long-lived phagocyte and antigen presenter.'},
{q:'Which leukocyte primarily targets parasitic worms?',c:['Neutrophil','Eosinophil','Lymphocyte','Monocyte'],a:'Eosinophil',why:'Worms are too large to engulf, so eosinophils release destructive enzymes onto them. Also elevated in allergy.'},
{q:'Which are GRANULOCYTES? (select all)',m:true,c:['Neutrophil','Eosinophil','Basophil','Lymphocyte','Monocyte'],a:['Neutrophil','Eosinophil','Basophil'],why:'Granulocytes have visible granules and lobed nuclei. Lymphocytes and monocytes are agranulocytes.'},
{q:'Platelets are…',c:['Whole cells with a nucleus','Cell fragments without a nucleus','A type of leukocyte','Made in the liver'],a:'Cell fragments without a nucleus',why:'Fragments shed from megakaryocytes in red bone marrow. Normal 150,000–300,000/mm³.'},
{q:'A platelet count below 150,000/mm³ is called…',c:['Leukopenia','Thrombocytopenia','Polycythemia','Anemia'],a:'Thrombocytopenia',why:'Causes easy bruising, petechiae, and prolonged bleeding.'},
{q:'Put hemostasis in order.',c:['Spasm → platelet plug → coagulation → retraction → thrombolysis','Coagulation → spasm → plug → retraction → thrombolysis','Platelet plug → spasm → retraction → coagulation → thrombolysis','Spasm → coagulation → plug → thrombolysis → retraction'],a:'Spasm → platelet plug → coagulation → retraction → thrombolysis',why:'Squeeze it, patch it, cement it, tighten it, clean it up.'},
{q:'Von Willebrand factor functions to…',c:['Dissolve clots','Make platelets stick to exposed collagen','Convert fibrinogen to fibrin','Constrict the vessel'],a:'Make platelets stick to exposed collagen',why:'Released by injured endothelial cells; binds platelet membrane receptors so they adhere and activate.'},
{q:'The final step of the coagulation cascade converts…',c:['Prothrombin to thrombin','Fibrinogen to fibrin','Plasminogen to plasmin','Factor X to prothrombin activator'],a:'Fibrinogen to fibrin',why:'Thrombin does this. The fibrin mesh is the actual clot scaffold.'},
{q:'The EXTRINSIC pathway is triggered by…',c:['Collagen contacting blood factors','Tissue factor from damaged tissue outside the vessel','Plasmin','Platelet granules'],a:'Tissue factor from damaged tissue outside the vessel',why:'Extrinsic = outside the vessel, and it is the faster of the two (seconds vs minutes).'},
{q:'Which enzyme dissolves a clot?',c:['Thrombin','Plasmin','Fibrinogen','Heparin'],a:'Plasmin',why:'tPA converts plasminogen (already built into the clot) into plasmin, which digests fibrin.'},
{q:'A clot that has broken loose and is traveling in the bloodstream is a…',c:['Thrombus','Embolus','Hematoma','Plaque'],a:'Embolus',why:'A thrombus stays where it formed. Once it travels, it is an embolus, and where it lodges is the embolism.'},
{q:'Which two substances do basophil granules release? (select all)',m:true,c:['Histamine','Heparin','Fibrin','Thrombin'],a:['Histamine','Heparin'],why:'Histamine dilates vessels and attracts other leukocytes; heparin is an anticoagulant.'},
{q:'Polycythemia is dangerous mainly because…',c:['Blood cannot clot','Blood becomes viscous and clots easily','Oxygen cannot bind hemoglobin','White cells are destroyed'],a:'Blood becomes viscous and clots easily',why:'Hematocrit can exceed 60–70%, straining the heart and raising stroke risk.'},
];

// ===== HEART MODULE =====
const HEART_CARDS=[
{id:'ht:loc',cls:'amine',g:'Anatomy',front:'Where is the heart located?',back:[['Cavity','In the MEDIASTINUM — the space between the lungs in the thoracic cavity.'],['Position','Behind the sternum, above the diaphragm, roughly two-thirds of it left of the midline.'],['Apex','The pointed inferior tip, directed down and to the LEFT, at about the 5th intercostal space.'],['Base','The broad superior surface where the great vessels attach, directed up and to the right.'],['Size','About the size of a closed fist.']],mn:'Apex points down-left (where you feel the beat), base is up top where the pipes connect.'},
{id:'ht:peri',cls:'amine',g:'Anatomy',front:'The pericardium',back:[['Fibrous pericardium','OUTER layer. Tough collagen bundles. Anchors the heart to the diaphragm and great vessels and prevents overfilling.'],['Serous pericardium','Thin inner double membrane that produces serous fluid.'],['Parietal layer','Fused to the inner surface of the fibrous pericardium; folds under at the great vessels.'],['Visceral layer','Also called the EPICARDIUM — adheres directly to the heart and is the most superficial layer of the heart wall.'],['Pericardial cavity','Between parietal and visceral layers; holds pericardial fluid that lubricates and reduces friction as the heart moves.']],mn:'Fibrous outside for anchoring, serous inside for lubrication. Visceral serous = epicardium; the two names are the same layer.'},
{id:'ht:layers',cls:'amine',g:'Anatomy',front:'The three layers of the heart wall',back:[['Epicardium','Outermost. The visceral serous pericardium. Rests on areolar connective tissue containing fat deposits and the coronary vessels.'],['Myocardium','Middle and THICKEST. Cardiac muscle — this is the layer that contracts. Much thicker in the left ventricle.'],['Endocardium','Innermost. Smooth endothelium lining the chambers and covering the valves; continuous with the vessel lining.']],mn:'Epi (on top), Myo (muscle), Endo (inside). Myocardium does the work.'},
{id:'ht:chambers',cls:'amine',g:'Anatomy',front:'The four chambers',back:[['Right atrium','Receives deoxygenated blood from the body via the superior and inferior venae cavae and coronary sinus.'],['Right ventricle','Pumps deoxygenated blood to the LUNGS. Thin wall — short trip, low pressure.'],['Left atrium','Receives oxygenated blood from the lungs via four pulmonary veins.'],['Left ventricle','Pumps oxygenated blood to the whole BODY. Thickest wall — highest pressure.'],['Septum','Interatrial and interventricular septa keep the two sides separated.']],mn:'Atria receive, ventricles pump. Right side to the lungs, left side to the body. Left is thicker because the trip is longer.'},
{id:'ht:valves',cls:'steroid',g:'Valves',front:'The four valves',back:[['Tricuspid (right AV)','Between right atrium and right ventricle. THREE cusps.'],['Bicuspid / Mitral (left AV)','Between left atrium and left ventricle. TWO cusps.'],['Pulmonary semilunar','Between right ventricle and pulmonary trunk.'],['Aortic semilunar','Between left ventricle and aorta.'],['Purpose','All four ensure ONE-WAY flow. They open and close from pressure differences, not muscle.']],mn:'LAB RAT: Left = Bicuspid, Right = Tricuspid. AV valves between chambers, semilunars at the exits.'},
{id:'ht:chord',cls:'steroid',g:'Valves',front:'Chordae tendineae and papillary muscles',back:[['Chordae tendineae','"Heart strings" — fibrous cords anchoring the AV valve cusps to the ventricle floor.'],['Papillary muscles','Cone-shaped myocardium projections the chordae attach to.'],['Function','When ventricles contract, papillary muscles contract too, tightening the cords so the AV valve cusps cannot blow backward (prolapse) into the atria.'],['Note','Semilunar valves have NO chordae — their cusp shape catches backflow on its own.']],mn:'Chordae are the parachute cords stopping the valve from inverting. Only the AV valves have them.'},
{id:'ht:sounds',cls:'steroid',g:'Valves',front:'Heart sounds',back:[['S1 — "lubb"','AV valves (tricuspid and mitral) closing at the start of ventricular contraction. Longer, louder.'],['S2 — "dupp"','Semilunar valves (pulmonary and aortic) closing at the end of ventricular contraction. Shorter, sharper.'],['Murmur','An abnormal swishing sound — usually a valve that does not close fully (regurgitation) or does not open fully (stenosis).']],mn:'Lubb = AV valves shut. Dupp = semilunars shut. The sound is closing, never opening.'},
{id:'ht:flow',cls:'peptide',g:'Blood flow',front:'Blood flow through the heart, in order',back:[['1','Superior/inferior vena cava → RIGHT ATRIUM'],['2','Tricuspid valve → RIGHT VENTRICLE'],['3','Pulmonary semilunar valve → pulmonary trunk → pulmonary ARTERIES → LUNGS (picks up O₂)'],['4','Pulmonary VEINS → LEFT ATRIUM'],['5','Bicuspid (mitral) valve → LEFT VENTRICLE'],['6','Aortic semilunar valve → AORTA → body'],['Then','Body → venae cavae → back to the right atrium.']],mn:'Every chamber is followed by a valve. The exception to the artery/vein rule lives here: pulmonary ARTERIES carry deoxygenated blood, pulmonary VEINS carry oxygenated.'},
{id:'ht:circ',cls:'peptide',g:'Blood flow',front:'Pulmonary vs systemic circuit',back:[['Pulmonary circuit','RIGHT side of the heart → lungs → back to the left atrium. Short, low pressure. Purpose: gas exchange.'],['Systemic circuit','LEFT side of the heart → entire body → back to the right atrium. Long, high pressure. Purpose: deliver O₂ and nutrients.'],['Why the left ventricle is thicker','It must generate enough pressure to push blood through the whole body, not just to the lungs next door.']],mn:'Right side = lungs (short trip, thin wall). Left side = body (long trip, thick wall).'},
{id:'ht:vessels',cls:'peptide',g:'Blood flow',front:'Arteries vs veins — and the exception',back:[['General rule','ARTERIES carry blood AWAY from the heart. VEINS carry blood TOWARD the heart.'],['The trap','The rule is about DIRECTION, not oxygen content.'],['Exception 1','Pulmonary arteries carry DEOXYGENATED blood (heart → lungs).'],['Exception 2','Pulmonary veins carry OXYGENATED blood (lungs → heart).'],['Structure','Arteries have thick muscular walls for pressure; veins are thinner with VALVES to prevent backflow.']],mn:'A = Away. Oxygen has nothing to do with the definition — the pulmonary vessels prove it.'},
{id:'ht:coronary',cls:'peptide',g:'Blood flow',front:'Coronary circulation',back:[['Why','The myocardium is too thick to be fed by the blood passing through the chambers — it needs its own supply.'],['Supply','Left and right coronary arteries branch off the AORTA just above the aortic semilunar valve.'],['Drainage','Cardiac veins → coronary sinus → right atrium.'],['When it fills','During ventricular RELAXATION (diastole) — contraction squeezes the coronary vessels shut.'],['Clinically','Blockage → angina, or myocardial infarction (heart attack) if the tissue dies.']],mn:'The heart feeds itself first — coronary arteries are the aorta\'s very first branches. And it eats while resting.'},
{id:'ht:autorhy',cls:'amine',g:'Conduction',front:'Autorhythmic vs contractile cells',back:[['Contractile cells','~99% of myocardium. Do the actual pumping work but do not initiate their own beat.'],['Autorhythmic cells','~1%. Non-contractile "pacemaker" cells that spontaneously depolarize — the heart\'s built-in electrical system.'],['Why it matters','The heart generates its own rhythm intrinsically; nerves only speed it up or slow it down, they do not start it. This is why a transplanted (denervated) heart still beats.']],mn:'Autorhythmic cells set the beat, contractile cells do the work. Nerves are a dimmer switch, not the power switch.'},
{id:'ht:conduct',cls:'amine',g:'Conduction',front:'The conduction pathway, in order',back:[['1 — SA node','"Sinoatrial node," in the right atrial wall. The natural PACEMAKER — fastest rate (~60–100 bpm), sets the pace for the whole heart.'],['2','Signal spreads through both atria → atria contract.'],['3 — AV node','"Atrioventricular node," at the base of the right atrium. Signal is DELAYED here (~0.1 sec) to let the atria finish emptying before the ventricles contract.'],['4 — AV bundle (bundle of His)','Only electrical connection between atria and ventricles; carries the signal into the septum.'],['5 — Bundle branches','Left and right, running down the septum.'],['6 — Purkinje fibers','Fan out through the ventricular walls, causing both ventricles to contract from the bottom up, squeezing blood upward toward the arteries.']],mn:'SA → AV (pause) → Bundle of His → branches → Purkinje. The AV delay is the whole reason atria finish before ventricles start.'},
{id:'ht:ectopic',cls:'amine',g:'Conduction',front:'What if the SA node fails?',back:[['Backup pacemakers','The AV node (~40–60 bpm) or Purkinje fibers (~20–40 bpm) can take over, just slower.'],['Ectopic pacemaker','Any site other than the SA node driving the rhythm — usually a problem.'],['Artificial pacemaker','Implanted device used when the natural system fails or is too slow (bradycardia).']],mn:'Rate drops the further down the backup sits: SA fastest, AV middle, Purkinje slowest. Slower backups are why a failing SA node causes bradycardia.'},
{id:'ht:ecg',cls:'amine',g:'Conduction',front:'ECG (EKG) waves',back:[['P wave','Atrial depolarization — atria are about to contract.'],['QRS complex','Ventricular depolarization — ventricles are about to contract. (Atrial repolarization is hidden inside this, masked by the much bigger signal.)'],['T wave','Ventricular repolarization — ventricles are resetting/relaxing.'],['Clinical use','An abnormal or missing wave points to exactly where the conduction pathway is breaking down.']],mn:'P = atria fire, QRS = ventricles fire, T = ventricles reset. Depolarize then repolarize, atria then ventricles.'},
{id:'ht:co',cls:'steroid',g:'Cardiac output',front:'Cardiac output (CO)',back:[['Definition','Volume of blood pumped by ONE ventricle in one minute.'],['Formula','CO = Heart Rate (HR) × Stroke Volume (SV)'],['Typical resting value','~5 L/min (≈70 bpm × 70 mL/beat).'],['Why it matters','CO must rise to meet the body\'s demand during exercise, and either HR or SV (or both) can drive that rise.']],mn:'CO = HR × SV. Change either factor and cardiac output changes with it.'},
{id:'ht:sv',cls:'steroid',g:'Cardiac output',front:'Stroke volume (SV) and its three factors',back:[['Definition','Volume of blood ejected by a ventricle in ONE beat. SV = EDV − ESV.'],['Preload','Degree of stretch on the ventricle before it contracts — set by venous return (EDV, end-diastolic volume). More stretch = more forceful contraction (Frank-Starling law).'],['Contractility','Force of contraction at a given preload — increased by sympathetic stimulation/epinephrine, decreased by some drugs and by ischemia.'],['Afterload','Pressure the ventricle must overcome to eject blood (e.g. aortic pressure). Higher afterload = harder to eject = lower SV if unchanged.']],mn:'Preload fills it, contractility squeezes it, afterload resists it. More stretch in, more force out — that\'s Starling\'s Law.'},
{id:'ht:starling',cls:'steroid',g:'Cardiac output',front:"Frank-Starling law of the heart",back:[['Statement','The more the cardiac muscle is stretched (within limits) by venous return, the more forcefully it contracts.'],['Mechanism','Greater stretch → more overlap/tension in the sarcomeres → stronger contraction.'],['Purpose','Automatically matches ventricular output to venous input — whatever comes in on one side goes back out the other, keeping left and right output balanced.']],mn:'Stretch more, squeeze harder. It is how the heart self-balances input and output beat to beat.'},
{id:'ht:hrreg',cls:'steroid',g:'Cardiac output',front:'Regulation of heart rate',back:[['Parasympathetic (vagus nerve)','Releases ACh → SLOWS the SA node. Dominant at rest.'],['Sympathetic','Releases norepinephrine/epinephrine → SPEEDS the SA node and increases contractility.'],['Chemical influences','Epinephrine ↑, thyroid hormone ↑ (chronic), high K⁺ or low Ca²⁺ can disrupt rhythm.'],['Other','Age, fitness level, and body temperature (fever ↑ HR) also shift HR.']],mn:'Vagus = brake, sympathetics = gas pedal. Rest and digest slows it, fight-or-flight speeds it.'},
];
const HEART_QUIZ=[
{q:'The heart is located in the…',c:['Pleural cavity','Mediastinum','Abdominal cavity','Pericardial sac only'],a:'Mediastinum',why:'The space between the lungs, behind the sternum, above the diaphragm.'},
{q:'The apex of the heart points…',c:['Up and to the right','Down and to the left','Straight posterior','Down and to the right'],a:'Down and to the left',why:'About the 5th intercostal space — where you feel the strongest beat. The base is superior.'},
{q:'Which is the OUTER layer of the pericardium?',c:['Visceral serous','Parietal serous','Fibrous pericardium','Endocardium'],a:'Fibrous pericardium',why:'Tough collagen that anchors the heart to the diaphragm and great vessels and prevents overfilling.'},
{q:'The visceral serous pericardium is also known as the…',c:['Myocardium','Endocardium','Epicardium','Parietal pericardium'],a:'Epicardium',why:'Same layer, two names. It is the most superficial layer of the heart wall itself.'},
{q:'Which layer of the heart wall actually contracts?',c:['Epicardium','Myocardium','Endocardium','Pericardium'],a:'Myocardium',why:'Cardiac muscle, and the thickest layer — especially in the left ventricle.'},
{q:'The pericardial fluid functions to…',c:['Nourish the myocardium','Reduce friction as the heart moves','Carry oxygen','Trigger contraction'],a:'Reduce friction as the heart moves',why:'It sits in the pericardial cavity between the parietal and visceral serous layers.'},
{q:'Which valve is between the left atrium and left ventricle?',c:['Tricuspid','Bicuspid (mitral)','Aortic semilunar','Pulmonary semilunar'],a:'Bicuspid (mitral)',why:'LAB RAT: Left Atrium = Bicuspid, Right Atrium = Tricuspid.'},
{q:'Chordae tendineae attach the AV valve cusps to the…',c:['Septum','Papillary muscles','Aorta','Endocardium of the atria'],a:'Papillary muscles',why:'They tighten during ventricular contraction so the cusps cannot prolapse into the atria.'},
{q:'The "lubb" (S1) sound is caused by…',c:['AV valves closing','Semilunar valves closing','AV valves opening','Blood entering the atria'],a:'AV valves closing',why:'Heart sounds are always valves CLOSING. S2 "dupp" is the semilunars.'},
{q:'Which chamber has the thickest wall?',c:['Right atrium','Left atrium','Right ventricle','Left ventricle'],a:'Left ventricle',why:'It pumps to the entire systemic circuit, so it must generate far more pressure than the right ventricle.'},
{q:'Blood in the right ventricle next passes through which valve?',c:['Tricuspid','Mitral','Pulmonary semilunar','Aortic semilunar'],a:'Pulmonary semilunar',why:'Right ventricle → pulmonary semilunar valve → pulmonary trunk → lungs.'},
{q:'The pulmonary VEINS carry…',c:['Deoxygenated blood to the lungs','Oxygenated blood to the left atrium','Deoxygenated blood to the right atrium','Oxygenated blood to the body'],a:'Oxygenated blood to the left atrium',why:'The exception to the usual pattern. Arteries/veins are defined by DIRECTION, not oxygen content.'},
{q:'Which vessels return blood to the RIGHT atrium? (select all)',m:true,c:['Superior vena cava','Inferior vena cava','Coronary sinus','Pulmonary veins','Aorta'],a:['Superior vena cava','Inferior vena cava','Coronary sinus'],why:'Pulmonary veins go to the LEFT atrium; the aorta carries blood away.'},
{q:'Put the flow in order after the left atrium.',c:['Mitral valve → left ventricle → aortic valve → aorta','Tricuspid → right ventricle → pulmonary valve','Aortic valve → left ventricle → mitral valve','Left ventricle → mitral valve → aorta'],a:'Mitral valve → left ventricle → aortic valve → aorta',why:'Every chamber is followed by a valve. Atrium → AV valve → ventricle → semilunar valve → artery.'},
{q:'The coronary arteries branch off of the…',c:['Pulmonary trunk','Aorta, just above the aortic valve','Superior vena cava','Left atrium'],a:'Aorta, just above the aortic valve',why:'The heart feeds itself first, taking the very first branches of freshly oxygenated blood.'},
{q:'The myocardium receives its own blood supply mainly during…',c:['Ventricular contraction (systole)','Ventricular relaxation (diastole)','Atrial contraction','It receives it continuously'],a:'Ventricular relaxation (diastole)',why:'Contraction compresses the coronary vessels shut. The heart eats while resting.'},
{q:'The pulmonary circuit carries blood…',c:['From the left ventricle to the body','From the right ventricle to the lungs','From the lungs to the body','From the body to the left atrium'],a:'From the right ventricle to the lungs',why:'Right side = lungs (short, low pressure). Left side = body (long, high pressure).'},
{q:'What percentage of heart muscle cells are autorhythmic (pacemaker) cells?',c:['~1%','~25%','~50%','~99%'],a:'~1%',why:'The other ~99% are contractile cells that do the pumping but do not initiate the beat.'},
{q:'The heart\'s natural pacemaker is the…',c:['AV node','SA node','Bundle of His','Purkinje fibers'],a:'SA node',why:'Located in the right atrial wall, it depolarizes fastest (~60–100 bpm) and sets the pace for the whole heart.'},
{q:'Put the conduction pathway in order.',c:['SA node → AV node → AV bundle → bundle branches → Purkinje fibers','AV node → SA node → Purkinje fibers → AV bundle','Purkinje fibers → AV bundle → SA node → AV node','SA node → Purkinje fibers → AV node → AV bundle'],a:'SA node → AV node → AV bundle → bundle branches → Purkinje fibers',why:'SA node fires, signal crosses the atria, pauses at the AV node, then travels down the septum via the bundle of His, bundle branches, and Purkinje fibers.'},
{q:'Why does the signal pause at the AV node?',c:['To speed up ventricular contraction','To let the atria finish emptying before the ventricles contract','To repolarize the SA node','It does not pause there'],a:'To let the atria finish emptying before the ventricles contract',why:'A ~0.1 second delay at the AV node ensures proper sequencing — atria contract and empty before ventricles begin.'},
{q:'If the SA node fails, which backup pacemaker fires FASTEST?',c:['AV node','Purkinje fibers','Bundle of His fibers alone','None — the heart stops'],a:'AV node',why:'AV node backup rate is ~40–60 bpm, faster than the Purkinje fibers\' ~20–40 bpm. Rate slows the further down the pathway the backup site sits.'},
{q:'On an ECG, the QRS complex represents…',c:['Atrial depolarization','Ventricular depolarization','Ventricular repolarization','Atrial repolarization'],a:'Ventricular depolarization',why:'P = atrial depolarization, QRS = ventricular depolarization (masking the smaller atrial repolarization signal), T = ventricular repolarization.'},
{q:'Cardiac output is calculated as…',c:['HR + SV','HR × SV','SV − HR','HR / SV'],a:'HR × SV',why:'CO = Heart Rate × Stroke Volume, typically ~5 L/min at rest (≈70 bpm × 70 mL).'},
{q:'Stroke volume is best defined as…',c:['Blood pumped per minute','Blood ejected by a ventricle in one beat','Total blood volume in the body','Heart rate at rest'],a:'Blood ejected by a ventricle in one beat',why:'SV = EDV − ESV. Multiply by heart rate to get cardiac output.'},
{q:'The Frank-Starling law states that…',c:['More stretch on the ventricle leads to a weaker contraction','More stretch on the ventricle leads to a stronger contraction','Heart rate determines stroke volume','Afterload increases contractility'],a:'More stretch on the ventricle leads to a stronger contraction',why:'Greater venous return stretches the ventricle (preload) more, producing a more forceful contraction — this keeps left and right output balanced.'},
{q:'Which factor of stroke volume is defined as the pressure the ventricle must overcome to eject blood?',c:['Preload','Contractility','Afterload','Heart rate'],a:'Afterload',why:'Preload is the stretch going in (venous return); contractility is the force of the squeeze; afterload is the resistance on the way out (e.g. aortic pressure).'},
{q:'Which branch of the nervous system SLOWS the SA node at rest?',c:['Sympathetic, via norepinephrine','Parasympathetic, via acetylcholine (vagus nerve)','Somatic motor neurons','Sympathetic, via epinephrine'],a:'Parasympathetic, via acetylcholine (vagus nerve)',why:'The vagus nerve is the brake on heart rate; sympathetic input (norepinephrine/epinephrine) is the accelerator.'},
];

<script>
// ===== helpers =====
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const byId=Object.fromEntries(H.map(h=>[h.id,h]));
const CLS={peptide:'Peptide / protein',steroid:'Steroid',amine:'Amine'};
const glandLabel=h=>h.gland==='adrenal'?(h.id==='epi'?'Adrenal medulla':'Adrenal cortex'):GLANDS[h.gland].name;

const cardState={filter:null,mode:'name',cur:null,flipped:false};
function cardPool(){const fs=MOD().cardFilters();if(!fs.some(f=>f[0]===cardState.filter))cardState.filter=fs[0][0];const f=fs.find(f=>f[0]===cardState.filter);return MOD().allCards().filter(f[2])}
function nextCard(){const pool=cardPool();if(!pool.length){cardState.cur=null;return}
  const w=pool.map(c=>(cardState.cur&&c.id===cardState.cur.id?0.2:1)*(6-box(c)));const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
  for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){cardState.cur=pool[i];break}}cardState.flipped=false}
function cards(){
  const pool=cardPool();if(!cardState.cur||!pool.some(c=>c.id===cardState.cur.id))nextCard();

    :`<div class="name cue" style="font-size:clamp(22px,6vw,30px)">${esc(c.front)}</div>`):'';

  :`<div class="empty">Nothing here yet.</div>`}`;
  $('#cf').onchange=e=>{cardState.filter=e.target.value;cardState.cur=null;cards()};
  v.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{cardState.mode=b.dataset.m;cardState.flipped=false;cards()});

function quiz(){const v=$('#view');const key=mod+':quiz';
  if(!Q.on){const hist=S.quiz[key]||[];v.innerHTML=`<div class="panel"><p class="eyebrow">multiple choice</p><h2>Quiz</h2><p style="color:var(--muted);font-size:14px;margin:0 0 12px">10 questions per round, mixed from the question bank and freshly generated ones. Some are "select all that apply" — tap every answer, then Check.</p>
    <div class="row" style="justify-content:space-between"><span class="chip">${hist.length?'last: '+hist[hist.length-1]+'/10 · best: '+Math.max(...hist)+'/10':'no rounds yet'}</span><button class="btn primary" id="qstart">Start round</button></div></div>
    ${Q.miss.length?`<div class="panel"><h3 style="margin-top:0">Review last round</h3><ul class="missed" style="padding:0;list-style:none;margin:0">${Q.miss.map(m=>`<li><b>${esc(m.q)}</b><br><span>${esc(m.why)}</span></li>`).join('')}</ul></div>`:''}`;
    $('#qstart').onclick=()=>{Object.assign(Q,{on:true,qs:pick(MOD().quiz(),10).map(q=>({...q,c:shuffle(q.c)})),i:0,picked:new Set(),answered:false,score:0,miss:[]});quiz()};return}
  if(Q.i>=Q.qs.length){const h=S.quiz[key]=(S.quiz[key]||[]).concat(Q.score).slice(-20);store.set();Q.on=false;
    v.innerHTML=`<div class="panel result"><div class="eyebrow">round complete</div><div class="score">${Q.score}<span style="font-size:24px;color:var(--muted)">/10</span></div>
    ${Q.miss.length?`<ul class="missed" style="padding:0;list-style:none">${Q.miss.map(m=>`<li><b>${esc(m.q)}</b><br><span>Answer: ${esc(Array.isArray(m.a)?m.a.join(', '):m.a)}. </span>${esc(m.why)}</li>`).join('')}</ul>`:'<p style="color:var(--ok)">Perfect round.</p>'}
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="quiz()">Back</button></div>`;return}
  const q=Q.qs[Q.i];const multi=!!q.m;const isRight=o=>multi?q.a.includes(o):o===q.a;
  v.innerHTML=`<div class="bhead"><span>question ${Q.i+1} of ${Q.qs.length}${multi?' · select all that apply':''}</span><span><b style="font-size:18px">${Q.score}</b></span></div>
  <div class="case"><div class="sx" style="margin-top:0">${esc(q.q)}</div>
  <div class="choices" id="qc">${q.c.map(o=>`<button data-o="${esc(o)}" class="${Q.picked.has(o)?'pick':''}${Q.answered?(isRight(o)?' right':Q.picked.has(o)?' wrong':''):''}"${Q.answered?' disabled':''}>${esc(o)}</button>`).join('')}</div>
  ${!Q.answered&&multi?`<button class="btn primary" id="qcheck" style="width:100%;margin-top:12px"${Q.picked.size?'':' disabled'}>Check</button>`:''}
  ${Q.answered?`<div class="explain"><b>${Q.last?'Correct':'Not quite'}${multi?' — answer: '+esc(q.a.join(', ')):''}</b>${esc(q.why)}</div><button class="btn primary" id="qnext" style="width:100%;margin-top:12px">${Q.i+1<Q.qs.length?'Next':'Finish'}</button>`:''}</div>`;
  const finish=()=>{const ok=multi?(q.c.every(o=>isRight(o)===Q.picked.has(o))):isRight([...Q.picked][0]);Q.last=ok;Q.answered=true;if(ok)Q.score++;else{Q.miss.push(q);if(q.gen){S.wrong[q.gen]=(S.wrong[q.gen]||0)+1;store.set()}}quiz();$('#qnext')?.scrollIntoView({behavior:'smooth',block:'end'})};
  $('#qc').onclick=e=>{const b=e.target.closest('button');if(!b||Q.answered)return;const o=b.dataset.o;if(multi){Q.picked.has(o)?Q.picked.delete(o):Q.picked.add(o);b.classList.toggle('pick');const ck=$('#qcheck');if(ck)ck.disabled=!Q.picked.size}else{Q.picked=new Set([o]);finish()}};
  $('#qcheck')&&($('#qcheck').onclick=finish);
  $('#qnext')&&($('#qnext').onclick=()=>{Q.i++;Q.picked=new Set();Q.answered=false;quiz()});
}

// ===== COURSE =====
function course(){const v=$('#view');
  v.innerHTML=`<div class="panel"><p class="eyebrow">Human A&P II · Section G03 · Fall 2026</p><h2 style="margin-bottom:6px">Course map</h2>
    <p style="font-size:13px;color:var(--muted);margin:0">Your weekly lecture order from D2L. Study material in this app is written to cover the same scope — it is not a copy of the slide decks, so keep using D2L for the actual lectures and figures.</p></div>
  ${COURSE.map(w=>`<div class="panel" style="${w.mod===mod?'border-color:var(--steroid)':''}"><div class="row" style="justify-content:space-between;align-items:baseline"><h3 style="margin:0">${esc(w.wk)}</h3><span class="chip"${w.mod===mod?' style="background:var(--steroid);color:var(--ink);border-color:var(--steroid)"':''}>${esc(w.dates)}</span></div>
    <div class="glist" style="margin-top:10px">${w.items.map(it=>{
      if(it.k==='yt')return `<div class="ytwrap"><div class="n" style="font-size:14px;font-weight:600;margin-bottom:6px">${esc(it.t)}</div><div class="yt"><iframe src="https://www.youtube.com/embed/${it.u}?rel=0" title="${esc(it.t)}" allowfullscreen loading="lazy"></iframe></div></div>`;
      if(it.k==='link')return `<a class="crow" href="${esc(it.u)}" target="_blank" rel="noopener"><span><span class="n">${esc(it.t)}</span><br><span class="s">opens in browser</span></span><span class="tag">↗</span></a>`;
      const tag={deck:'slides',lec:'lecture',work:'worksheet'}[it.k],note={deck:'in D2L Content',lec:'video in D2L — sign in to watch',work:'in D2L Content'}[it.k];
      return `<div class="crow"><span><span class="n">${esc(it.t)}</span><br><span class="s">${esc(note)}</span></span><span class="tag">${tag}</span></div>`}).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn small" onclick="jump('${w.mod}')">Study ${esc(MODULES[w.mod].name)}</button></div></div>`).join('')}
  <div class="panel"><p class="eyebrow">why the lectures aren't embedded</p><p style="font-size:13px;color:var(--muted);margin:0">Her recordings are D2L links that only play while you're signed in to the course, so they can't be pulled in here. The slide decks are Pearson copyrighted material, so they aren't copied in either — this app covers the same topics in its own words and diagrams.</p></div>`;
}
function jump(m){mod=m;S.mod=m;store.set();tab=MOD().tabs[0];cardState.cur=null;M.tiles=[];Q.on=false;stopBlitz();$('#modsel').value=m;render()}

// ===== LAB (blood typing) =====
const L={donor:'O-',recip:'A+',tray:'A+'};
function lab(){const v=$('#view');const s=btSafe(L.donor,L.recip);const d=BT(L.donor),r=BT(L.recip);
  const why=s?`${L.donor} cells carry ${d.ag.length?d.ag.join(' and ')+' antigen'+(d.ag.length>1?'s':''):'no antigens'}. ${L.recip} plasma has ${r.ab.length?'anti-'+r.ab.join(' and anti-'):'no antibodies'}${d.rh?'; recipient is Rh+ so D is fine':''}. No match → no clumping.`
    :(d.ag.some(x=>r.ab.includes(x))?`${L.recip} plasma has anti-${d.ag.find(x=>r.ab.includes(x))}. ${L.donor} cells carry the ${d.ag.find(x=>r.ab.includes(x))} antigen. Antibody meets antigen → agglutination and hemolysis.`:`${L.donor} cells carry the D antigen. ${L.recip} is Rh− — first exposure sensitizes, any later exposure (or pregnancy) reacts. Rh− recipients get Rh− cells.`);
  const sel=(id,val)=>`<select class="sel" id="${id}">${BT_TYPES.map(t=>`<option${t===val?' selected':''}>${t}</option>`).join('')}</select>`;
  v.innerHTML=`<div class="panel"><p class="eyebrow">transfusion check</p><div class="row" style="gap:10px;align-items:end"><div><div class="eyebrow">donor cells</div>${sel('ld',L.donor)}</div><span style="font-size:22px;padding-bottom:6px">→</span><div><div class="eyebrow">recipient</div>${sel('lr',L.recip)}</div></div>
    <div class="explain" style="border-color:${s?'var(--ok)':'var(--bad)'}"><b style="color:${s?'var(--ok)':'var(--bad)'}">${s?'Compatible':'Transfusion reaction'}</b>${esc(why)}</div></div>
  <div class="panel"><p class="eyebrow">compatibility grid — donor (rows) → recipient (columns)</p><div class="cgrid"><div></div>${BT_TYPES.map(t=>`<div class="ch">${t}</div>`).join('')}${BT_TYPES.map(dn=>`<div class="ch">${dn}</div>${BT_TYPES.map(rc=>`<button class="cell ${btSafe(dn,rc)?'ok':'no'}" data-d="${dn}" data-r="${rc}">${btSafe(dn,rc)?'✓':'✕'}</button>`).join('')}`).join('')}</div>
    <p style="font-size:13px;color:var(--muted);margin:10px 0 0">O− row is all ✓ (universal donor). AB+ column is all ✓ (universal recipient). Tap any cell to load it above.</p></div>
  <div class="panel"><p class="eyebrow">typing tray</p><div class="row" style="justify-content:space-between"><span style="font-size:14px">Blood type:</span>${sel('lt',L.tray)}</div>${trayHtml(L.tray)}
    <p style="font-size:13px;color:var(--muted);margin:6px 0 0">Each well holds antibody serum. A clump means the cell HAS that antigen: ${BT(L.tray).ag.length?BT(L.tray).ag.map(x=>x+' antigen').join(', ')+' present':'no antigens present'}.</p></div>
  <div class="panel"><p class="eyebrow">quick table</p><table><tr><th>Type</th><th>Antigens</th><th>Antibodies</th><th>Gets RBCs from</th><th>US</th></tr>${BT_TYPES.map(t=>{const b=BT(t);return `<tr><td style="text-transform:none;font-size:13px">${t}</td><td style="color:var(--chalk);font-family:var(--body);text-transform:none">${b.ag.join(', ')||'none'}</td><td style="color:var(--chalk);font-family:var(--body);text-transform:none">${b.ab.map(x=>'anti-'+x).join(', ')||'none'}</td><td style="color:var(--chalk);font-family:var(--body);text-transform:none;white-space:normal">${BT_TYPES.filter(dn=>btSafe(dn,t)).join(' ')}</td><td style="text-transform:none">${BT_FREQ[t]}</td></tr>`}).join('')}</table></div>`;
  $('#ld').onchange=e=>{L.donor=e.target.value;lab()};$('#lr').onchange=e=>{L.recip=e.target.value;lab()};$('#lt').onchange=e=>{L.tray=e.target.value;lab()};
  v.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{L.donor=b.dataset.d;L.recip=b.dataset.r;lab()});
}

render();
</script>
